// Lista de chaves em state que sincronizam (em ordem para respeitar foreign keys)
const SYNC_ORDER = ['insumos','produtos','receitas','clientes','fornecedores','fornecedorInsumos','movimentos','pedidos','ordens','contasReceber','contasPagar','logs'];

function tableName(stateKey) {
  return FIELD_MAPS[stateKey]?.table || stateKey;
}

function toDbRow(stateKey, obj) {
  const cfg = FIELD_MAPS[stateKey] || {};
  const map = cfg.toDb || {};
  const allowed = cfg.allowed || null;
  const out = {};
  for (const k in obj) {
    const dbKey = map[k] || k;
    // Se temos lista de permitidos, filtra
    if (allowed && !allowed.includes(dbKey)) continue;
    out[dbKey] = obj[k];
  }
  return out;
}

function fromDbRow(stateKey, obj) {
  const map = FIELD_MAPS[stateKey]?.fromDb || {};
  const out = {};
  for (const k in obj) {
    const jsKey = map[k] || k;
    out[jsKey] = obj[k];
  }
  // Remove campo created_at (não usado no app)
  delete out.created_at;
  return out;
}

// ----- Autenticação ---------------------------------------------------------
async function checkAuth() {
  if (!sb) return null;
  const { data: { session } } = await sb.auth.getSession();
  return session?.user || null;
}

async function loginUser(email, password) {
  if (!sb) throw new Error('Supabase não inicializado');
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return data.user;
}

async function logoutUser() {
  if (!sb) return;
  await sb.auth.signOut();
  location.reload();
}

// ----- Carregar tudo do Supabase para state -------------------------------
async function carregarStateDoSupabase() {
  if (!sb) throw new Error('Supabase não inicializado');
  const novoState = seedData(); // estrutura base

  // Empresa (linha única)
  const { data: emp } = await sb.from('empresa').select('*').eq('id','main').single();
  if (emp) Object.assign(novoState.empresa, fromDbRow('empresa', emp));

  // Markup (linha única)
  const { data: mk } = await sb.from('markup').select('*').eq('id','main').single();
  if (mk) Object.assign(novoState.markup, fromDbRow('markup', mk));

  // Arrays
  for (const key of SYNC_ORDER) {
    const t = tableName(key);
    const { data, error } = await sb.from(t).select('*');
    if (error) { console.error('Erro ao carregar', t, error); continue; }
    novoState[key] = (data || []).map(r => fromDbRow(key, r));
  }
  return novoState;
}

// ----- Sincronizar UMA tabela (lê do state e faz upsert) -------------------
async function sincronizarTabela(stateKey) {
  if (!sb) return;
  const t = tableName(stateKey);
  if (stateKey === 'empresa' || stateKey === 'markup') {
    const row = toDbRow(stateKey, { id:'main', ...state[stateKey] });
    const { error } = await sb.from(t).upsert(row);
    if (error) console.error('Erro upsert', t, error);
    return;
  }
  // Array: pegar IDs atuais no banco e comparar com state
  const itens = state[stateKey] || [];
  if (itens.length === 0) {
    // Apagar tudo desta tabela
    const { error } = await sb.from(t).delete().neq('id','___nunca___');
    if (error) console.error('Erro delete', t, error);
    return;
  }
  // Upsert em batch
  const rows = itens.map(it => toDbRow(stateKey, it));
  const { error: upErr } = await sb.from(t).upsert(rows);
  if (upErr) console.error('Erro upsert', t, upErr);
  // Apagar registros que sumiram do state
  const idsAtuais = itens.map(i => i.id);
  const { data: nbanco } = await sb.from(t).select('id');
  const aRemover = (nbanco || []).map(r => r.id).filter(id => !idsAtuais.includes(id));
  if (aRemover.length > 0) {
    const { error: delErr } = await sb.from(t).delete().in('id', aRemover);
    if (delErr) console.error('Erro delete subset', t, delErr);
  }
}

// ----- Sincronizar tudo (chamado em background pelo debounce) -------------
async function sincronizarTudo() {
  if (!sb || _syncInProgress) return;
  _syncInProgress = true;
  mostrarStatusSync('sincronizando');
  try {
    const tabelas = Array.from(_dirtyTables);
    _dirtyTables.clear();
    for (const key of tabelas) {
      await sincronizarTabela(key);
    }
    mostrarStatusSync('ok');
  } catch (e) {
    console.error('Erro de sync:', e);
    mostrarStatusSync('erro');
  } finally {
    _syncInProgress = false;
  }
}

// Marca tabelas como "sujas" e agenda sync (debounce 800ms)
function marcarSujo(stateKey) {
  _dirtyTables.add(stateKey);
  if (_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(sincronizarTudo, 800);
}

function marcarTudoSujo() {
  ['empresa','markup', ...SYNC_ORDER].forEach(k => _dirtyTables.add(k));
  if (_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(sincronizarTudo, 800);
}

function mostrarStatusSync(estado) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  const map = {
    'sincronizando': { txt:'Salvando…', cor:'#BA7517', bg:'#FAEEDA' },
    'ok':            { txt:'Salvo na nuvem ✓', cor:'#04342C', bg:'#E1F5EE' },
    'erro':          { txt:'Erro ao salvar', cor:'#501313', bg:'#FCEBEB' }
  };
  const c = map[estado] || map.ok;
  el.style.cssText = `background:${c.bg}; color:${c.cor}; padding:2px 8px; border-radius:4px; font-size:11px;`;
  el.textContent = c.txt;
  if (estado === 'ok') {
    setTimeout(() => { if (el.textContent === c.txt) el.textContent = ''; el.style.cssText = ''; }, 2000);
  }
}


const fmtBRL = v => 'R$ ' + (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtNum = (v, d=3) => (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:d});

// Parse de data tipo "YYYY-MM-DD" como fuso LOCAL (evita o bug do UTC).
// Quando JS recebe "2026-05-19" e faz new Date(), interpreta como meia-noite UTC.
// Em BR (UTC−3) isso vira 18/05 21h — exibe 1 dia antes. Esta função corrige.
function parseDataBR(s) {
  if (!s) return null;
  if (s instanceof Date) return s;
  if (typeof s !== 'string') return new Date(s);
  // String "YYYY-MM-DD" pura (sem horário) → criar como data local
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
  // String com horário (ISO completo) — JS já interpreta certo
  return new Date(s);
}

const fmtDate = d => {
  const dt = parseDataBR(d);
  if (!dt) return '';
  return dt.toLocaleDateString('pt-BR');
};
const fmtDateTime = d => {
  const dt = parseDataBR(d);
  if (!dt) return '';
  return dt.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
};
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => {
  // Data de hoje em fuso LOCAL como "YYYY-MM-DD"
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
// Adiciona N dias a uma data string "YYYY-MM-DD" (sem bug de fuso)
function addDaysISO(dataISO, dias) {
  const dt = parseDataBR(dataISO) || new Date();
  dt.setDate(dt.getDate() + (Number(dias) || 0));
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

// Simple SHA-256 for audit hashing (Web Crypto API)
async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function resetState() {

// Migração de state: preserva dados existentes e injeta campos novos com defaults
function migrarState() {
  // 0) Garantir que todos os arrays/objetos críticos existam
  const arraysObrigatorios = ['usuarios','insumos','produtos','receitas','clientes','fornecedores','fornecedorInsumos','movimentos','pedidos','ordens','contasReceber','contasPagar','logs','backups'];
  arraysObrigatorios.forEach(k => { if (!Array.isArray(state[k])) state[k] = []; });
  if (!state.empresa) state.empresa = {
    razaoSocial:'', nomeFantasia:'', cnpj:'', ie:'', regime:'SIMPLES_NACIONAL',
    faixaSimples:0, ncmPadrao:'1905.31.00', cfopPadrao:'5101',
    endereco:{ logradouro:'', bairro:'', municipio:'', uf:'', cep:'' },
    contato:{ responsavel:'', telefone:'', whatsapp:'', email:'' },
    nfeSerie:1, nfeProximoNumero:1
  };
  if (!state.usuarioAtual) state.usuarioAtual = { id:'u1', nome:'Amanda Cecílio', email:'amanda.cecilio@hotmail.com', perfil:'proprietario' };
  if (state.usuarios.length === 0) state.usuarios.push({ id:'u1', nome:'Amanda Cecílio', email:'amanda.cecilio@hotmail.com', perfil:'proprietario', ativo:true });
  // 1) Markup — adicionar composição em R$/mês se ainda não existir
  if (!state.markup) state.markup = {};
  if (typeof state.markup.df !== 'number') state.markup.df = 17;
  if (typeof state.markup.dv !== 'number') state.markup.dv = 15;
  if (typeof state.markup.ml !== 'number') state.markup.ml = 18;
  if (!state.markup.modo) state.markup.modo = 'PERCENTUAL';
  if (typeof state.markup.producaoMensal !== 'number') state.markup.producaoMensal = 1200;
  if (typeof state.markup.custoFixoMes !== 'number') state.markup.custoFixoMes = 4800;
  if (typeof state.markup.custoVariavelMes !== 'number') state.markup.custoVariavelMes = 1500;
  if (typeof state.markup.margemLiquidaMes !== 'number') state.markup.margemLiquidaMes = 3600;
  if (typeof state.markup.markupEmbalagem !== 'number') state.markup.markupEmbalagem = 30;
  // 2) Pedidos — adicionar campo "tipo", gramatura, subtotal, bonificacao, modo e embalagemId
  if (Array.isArray(state.pedidos)) {
    state.pedidos.forEach(p => {
      if (!p.tipo) p.tipo = 'ENCOMENDA';
      if (Array.isArray(p.itens)) {
        p.itens.forEach(it => {
          if (typeof it.gramatura !== 'number' || it.gramatura <= 0) {
            const prod = state.produtos.find(x => x.id === it.produtoId);
            it.gramatura = prod?.pesoLiq || 500;
          }
          if (!it.modo) it.modo = 'FRACIONADO';
          if (typeof it.embalagemId === 'undefined') it.embalagemId = null;
        });
      }
      if (typeof p.subtotal !== 'number') {
        p.subtotal = (p.itens || []).reduce((s, i) => s + (i.qtd * i.preco), 0);
      }
      if (typeof p.bonificacao !== 'number') {
        p.bonificacao = (Number(p.total) || 0) - (Number(p.subtotal) || 0);
        if (Math.abs(p.bonificacao) < 0.005) p.bonificacao = 0;
      }
    });
  }
  // 3) Contas a pagar — adicionar campo categoria para DRE
  if (Array.isArray(state.contasPagar)) {
    state.contasPagar.forEach(c => {
      if (!c.categoria) c.categoria = 'operacional';
    });
  }
  // 4) Limpar referências aos módulos removidos (mantém perfil proprietário apenas)
  if (state.permissoes) {
    // remove perfis não-proprietário (módulo 14 foi removido)
    const novos = { proprietario: state.permissoes.proprietario || { '01':2,'02':2,'03':2,'05':2,'06':2,'07':2,'08':2,'09':2,'10':2,'11':2,'13':2,'15':2 } };
    state.permissoes = novos;
    // remove referências dos módulos extintos da matriz do proprietário
    delete state.permissoes.proprietario['04'];
    delete state.permissoes.proprietario['12'];
    delete state.permissoes.proprietario['14'];
  }
}

// CMP recalculation
function recalcularCmp(insumoId, qtdRecebida, custoUnitario) {
  const i = state.insumos.find(x => x.id === insumoId);
  if (!i) return null;
  const qa = Number(i.saldo), ca = Number(i.cmp);
  const qr = Number(qtdRecebida), cr = Number(custoUnitario);
  const novoSaldo = qa + qr;
  const novoCmp = novoSaldo === 0 ? cr : (qa*ca + qr*cr) / novoSaldo;
  const variacao = ca === 0 ? 0 : ((novoCmp - ca) / ca) * 100;
  return { cmpAnterior:ca, cmpNovo:novoCmp, saldoAnterior:qa, saldoNovo:novoSaldo, variacao, alerta: Math.abs(variacao) >= 10 };
}

function lancarEntradaInsumo(insumoId, qtd, custo, obs) {
  const r = recalcularCmp(insumoId, qtd, custo);
  if (!r) return false;
  const i = state.insumos.find(x => x.id === insumoId);
  i.saldo = r.saldoNovo;
  i.cmp = r.cmpNovo;
  state.movimentos.unshift({
    id: 'm'+uid(), insumoId, tipo:'ENTRADA_NFE',
    qtd: qtd, cmpAplicado: custo, saldoApos: r.saldoNovo,
    data: new Date().toISOString(),
    obs: obs + (r.alerta ? ` · alerta ${r.variacao > 0 ? '+' : ''}${r.variacao.toFixed(1)}%` : '')
  });
  logAuditoria('01_motor_cmp', r.alerta ? 'ENTRADA_NFE_COM_ALERTA' : 'ENTRADA_NFE', insumoId,
    `${i.nome}: ${qtd}${i.unidade} a ${fmtBRL(custo)} · CMP ${fmtBRL(r.cmpAnterior)} → ${fmtBRL(r.cmpNovo)}`);
  persistState();
  return r;
}

function lancarSaidaInsumo(insumoId, qtd, tipo, obs) {
  const i = state.insumos.find(x => x.id === insumoId);
  if (!i) return false;
  if (i.saldo < qtd) { toast(`Saldo insuficiente: ${i.nome}`, 'erro'); return false; }
  i.saldo -= qtd;
  state.movimentos.unshift({
    id: 'm'+uid(), insumoId, tipo, qtd: -qtd, cmpAplicado: i.cmp,
    saldoApos: i.saldo, data: new Date().toISOString(), obs
  });
  return true;
}

// Receita: custo unitário
function calcularCustoReceita(receitaId) {
  const r = state.receitas.find(x => x.id === receitaId);
  if (!r) return null;
  let custoInsumos = 0;
  const detalhes = r.itens.map(it => {
    const ins = state.insumos.find(x => x.id === it.insumoId);
    const custo = it.qtd * ins.cmp;
    custoInsumos += custo;
    return { nome: ins.nome, qtd: it.qtd, unidade: it.unidade, cmp: ins.cmp, custo };
  });
  const custoMod = r.tempoH * r.taxaMod;
  const custoDepreciacao = r.depreciacao;
  return {
    custoInsumos, custoMod, custoDepreciacao,
    custoTotal: custoInsumos + custoMod + custoDepreciacao,
    detalhes
  };
}

// Markup divisor (modo percentual clássico)
function calcularMarkup(df, dv, ml, custoUnitario) {
  const soma = Number(df) + Number(dv) + Number(ml);
  if (soma >= 100) return { erro: 'Soma ≥ 100% — markup impossível' };
  const markupDivisor = 100 / (100 - soma);
  const precoSugerido = custoUnitario * markupDivisor;
  const lucroUnit = precoSugerido * (ml/100);
  return { markupDivisor, precoSugerido, lucroUnit, soma };
}

// Composição em R$/mês — rateia pela produção mensal estimada e SOMA ao custo unitário
function calcularComposicaoValor(custoUnitario, m) {
  const prod = Math.max(Number(m.producaoMensal) || 0, 1);
  const cfUn = (Number(m.custoFixoMes) || 0) / prod;
  const cvUn = (Number(m.custoVariavelMes) || 0) / prod;
  const mlUn = (Number(m.margemLiquidaMes) || 0) / prod;
  const precoSugerido = custoUnitario + cfUn + cvUn + mlUn;
  // Equivalência em % para referência
  const dfPct = precoSugerido > 0 ? (cfUn / precoSugerido) * 100 : 0;
  const dvPct = precoSugerido > 0 ? (cvUn / precoSugerido) * 100 : 0;
  const mlPct = precoSugerido > 0 ? (mlUn / precoSugerido) * 100 : 0;
  return { cfUn, cvUn, mlUn, precoSugerido, lucroUnit: mlUn,
           markupDivisor: custoUnitario > 0 ? precoSugerido / custoUnitario : 0,
           dfPct, dvPct, mlPct, soma: dfPct + dvPct + mlPct };
}

// Preço sugerido unificado (respeita o modo de cálculo selecionado)
function calcularPrecoSugerido(custoUnitario) {
  const m = state.markup;
  if (m.modo === 'VALOR_MENSAL') {
    return calcularComposicaoValor(custoUnitario, m).precoSugerido;
  }
  const r = calcularMarkup(m.df, m.dv, m.ml, custoUnitario);
  return r.erro ? 0 : r.precoSugerido;
}

// Confirmar pedido — baixa de PA (se houver) + conta a receber
function confirmarPedido(pedidoId) {
  const p = state.pedidos.find(x => x.id === pedidoId);
  if (!p || p.statusComercial !== 'RASCUNHO') return false;
  const tipo = p.tipo || 'ENCOMENDA';
  const opsVinculadas = state.ordens.filter(o => o.pedidoOrigemId === p.id);

  // Calcular necessidade equivalente em unidades por produto (somando várias gramaturas)
  const necessario = {}; // produtoId → unidades equivalentes
  p.itens.forEach(it => {
    const prod = state.produtos.find(x => x.id === it.produtoId);
    if (!prod) return;
    const gramatura = it.gramatura || prod.pesoLiq;
    const unEq = (it.qtd * gramatura) / (prod.pesoLiq || 500);
    necessario[it.produtoId] = (necessario[it.produtoId] || 0) + unEq;
  });

  // Calcular necessidade de embalagem (itens modo EMBALAGEM)
  const necessarioEmb = {};
  p.itens.forEach(it => {
    if (it.modo === 'EMBALAGEM' && it.embalagemId) {
      necessarioEmb[it.embalagemId] = (necessarioEmb[it.embalagemId] || 0) + it.qtd;
    }
  });

  // Validar saldo de embalagem ANTES de tudo
  for (const [embId, qtdNec] of Object.entries(necessarioEmb)) {
    const emb = state.insumos.find(i => i.id === embId);
    if (!emb || emb.saldo < qtdNec) {
      toast(`Embalagem insuficiente: ${emb?.nome || embId} (precisa ${qtdNec}, tem ${emb?.saldo || 0})`, 'erro');
      return false;
    }
  }

  // Validar saldo de PA
  const faltam = [];
  for (const [produtoId, qtdNec] of Object.entries(necessario)) {
    const prod = state.produtos.find(x => x.id === produtoId);
    if (prod.saldoPa < qtdNec) {
      faltam.push({ prod, pedido: qtdNec, saldo: prod.saldoPa });
    }
  }

  if (faltam.length > 0) {
    if (tipo === 'PRONTA_ENTREGA') {
      toast(`Pronta entrega exige estoque · ${faltam[0].prod.nome}: precisa ${fmtNum(faltam[0].pedido,2)}, tem ${fmtNum(faltam[0].saldo,2)}`, 'erro');
      return false;
    }
    // ENCOMENDA: se há OP vinculada, confirma sem baixar PA e marca status
    if (opsVinculadas.length > 0) {
      p.statusComercial = 'CONFIRMADO';
      p.statusProdutivo = opsVinculadas.some(o => o.status === 'EM_ANDAMENTO') ? 'EM_PRODUCAO' : 'AGUARDANDO';
    } else {
      // Sem OP vinculada — pergunta se quer criar uma agora
      if (!confirm(`Encomenda sem estoque suficiente e sem OP vinculada. Confirmar e gerar OP(s) automaticamente?\n\nOK = cria OP(s) programada(s) e confirma o pedido\nCancelar = não confirma o pedido.`)) return false;
      faltam.forEach(f => {
        const proxNumOP = Math.max(...state.ordens.map(o => o.numero), 0) + 1;
        const loteUn = Math.max(1, Math.ceil(f.pedido - f.saldo));
        state.ordens.push({
          id: 'op'+uid(), numero: proxNumOP, produtoId: f.prod.id,
          tamanhoLote: loteUn, status: 'PROGRAMADA',
          programadaPara: p.dataEntrega,
          iniciadaEm: null, concluidaEm: null, custoTotal: null, custoUnitario: null,
          pedidoOrigemId: p.id,
          fases: [
            { nome:'Pesagem', concluida:false }, { nome:'Mistura', concluida:false },
            { nome:'Modelagem', concluida:false }, { nome:'Forneamento', concluida:false },
            { nome:'Embalagem', concluida:false }
          ]
        });
        logAuditoria('10_ordem_producao', 'PROGRAMADA_VIA_PEDIDO', 'op'+uid(),
          `OP-${proxNumOP} programada automaticamente · ${loteUn} un de ${f.prod.nome} para Pedido #${p.numero}`);
      });
      p.statusComercial = 'CONFIRMADO';
      p.statusProdutivo = 'AGUARDANDO';
      // Baixa apenas o que existe em estoque
      for (const [produtoId, qtdNec] of Object.entries(necessario)) {
        const prod = state.produtos.find(x => x.id === produtoId);
        const baixar = Math.min(qtdNec, prod.saldoPa);
        prod.saldoPa = Math.max(0, prod.saldoPa - baixar);
      }
    }
  } else {
    // Estoque ok — baixa proporcional total
    for (const [produtoId, qtdNec] of Object.entries(necessario)) {
      const prod = state.produtos.find(x => x.id === produtoId);
      prod.saldoPa = Math.max(0, prod.saldoPa - qtdNec);
    }
    p.statusComercial = 'CONFIRMADO';
    if (tipo === 'PRONTA_ENTREGA') p.statusProdutivo = 'PRONTO';
  }
  // Baixar saldo de embalagem (itens modo EMBALAGEM)
  for (const [embId, qtdNec] of Object.entries(necessarioEmb)) {
    const emb = state.insumos.find(i => i.id === embId);
    if (emb) emb.saldo = Math.max(0, emb.saldo - qtdNec);
  }
  // Gerar conta a receber
  const cli = state.clientes.find(c => c.id === p.clienteId);
  // Prazo: usa do pedido se definido, senão usa do cliente
  const prazoDias = (typeof p.prazoDias === 'number') ? p.prazoDias : (cli?.prazoDias || 0);
  const baseData = todayISO(); // data atual em fuso local
  const vencimento = addDaysISO(baseData, prazoDias);
  state.contasReceber.unshift({
    id: 'cr'+uid(), pedidoId: p.id,
    descricao: `Pedido #${p.numero} · ${cli.nome}`,
    valor: p.total, vencimento, status: 'ABERTA'
  });
  logAuditoria('06_pedido', 'CONFIRMADO', p.id, `Pedido #${p.numero} (${tipo === 'ENCOMENDA' ? 'encomenda' : 'pronta entrega'}) confirmado · ${fmtBRL(p.total)}`);
  persistState();
  return true;
}

// Log de auditoria com hash encadeado
async function logAuditoria(modulo, acao, entidadeId, detalhes) {
  const ultimoHash = state.logs[0]?.hash || 'GENESIS';
  const conteudo = `${state.usuarioAtual.id}|${modulo}|${acao}|${entidadeId}|${detalhes}|${ultimoHash}`;
  const hash = (await sha256(conteudo)).slice(0,4) + '...' + (await sha256(conteudo)).slice(-4);
  state.logs.unshift({
    id: 'l'+uid(), usuarioId: state.usuarioAtual.id,
    modulo, acao, entidadeId, criadoEm: new Date().toISOString(),
    hash, detalhes
  });
  if (state.logs.length > 100) state.logs = state.logs.slice(0, 100);
  persistState();
}

function recalcularEntradaInsumo(insumoId, origem) {
  const inputQtd = document.querySelector('[name="qtd"]');
  const inputTotal = document.querySelector('[name="valorTotal"]');
  const inputUnit = document.querySelector('[name="custo"]');
  if (!inputQtd || !inputTotal || !inputUnit) return;
  const qtd = parseFloat(inputQtd.value) || 0;
  const total = parseFloat(inputTotal.value) || 0;
  const unit = parseFloat(inputUnit.value) || 0;

  // Lógica bidirecional:
  // - origem='total' → calcula unit a partir de total e qtd
  // - origem='unit'  → calcula total a partir de unit e qtd
  // - origem='qtd'   → se total já preenchido, recalcula unit; senão se unit preenchido, recalcula total
  if (origem === 'total' && qtd > 0 && total > 0) {
    inputUnit.value = (total / qtd).toFixed(5);
  } else if (origem === 'unit' && qtd > 0 && unit > 0) {
    inputTotal.value = (unit * qtd).toFixed(2);
  } else if (origem === 'qtd' && qtd > 0) {
    if (total > 0) inputUnit.value = (total / qtd).toFixed(5);
    else if (unit > 0) inputTotal.value = (unit * qtd).toFixed(2);
  }
  preverCmp(insumoId);
}

function preverCmp(insumoId) {
  const qtd = parseFloat(document.querySelector('[name="qtd"]')?.value || 0);
  const custo = parseFloat(document.querySelector('[name="custo"]')?.value || 0);
  const box = document.getElementById('preview-cmp');
  if (!qtd || !custo) { box.innerHTML = ''; return; }
  const r = recalcularCmp(insumoId, qtd, custo);
  box.innerHTML = `
    <div class="${r.alerta ? 'danger-banner' : 'success-banner'} text-xs">
      <p class="font-medium mb-1">Prévia do recálculo</p>
      <p class="num">CMP: ${fmtBRL(r.cmpAnterior)} → ${fmtBRL(r.cmpNovo)} (${r.variacao>0?'+':''}${r.variacao.toFixed(2)}%)</p>
      <p class="num">Saldo: ${fmtNum(r.saldoAnterior)} → ${fmtNum(r.saldoNovo)}</p>
      ${r.alerta ? '<p class="font-semibold mt-1">⚠ Variação acima de 10% — revise se o custo está correto</p>' : ''}
    </div>
  `;
}

function handleEntradaInsumo(ev, insumoId) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const qtd = parseFloat(fd.get('qtd'));
  let custo = parseFloat(fd.get('custo'));
  const valorTotal = parseFloat(fd.get('valorTotal'));
  // Se o usuário preencheu só o total, derivar custo unitário
  if ((!custo || custo <= 0) && valorTotal > 0 && qtd > 0) {
    custo = valorTotal / qtd;
  }
  if (!custo || custo <= 0) {
    toast('Informe o valor total da NF-e ou o custo unitário', 'erro');
    return;
  }
  const r = lancarEntradaInsumo(insumoId, qtd, custo, fd.get('obs') || 'Entrada manual');
  fecharModal();
  toast(`Entrada lançada · CMP recalculado (${r.variacao>0?'+':''}${r.variacao.toFixed(1)}%)`);
  render();
}

function handleEditarInsumo(ev, insumoId) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const i = state.insumos.find(x => x.id === insumoId);
  if (!i) return;
  const saldoAnt = i.saldo, cmpAnt = i.cmp;
  i.nome = fd.get('nome');
  i.tipo = fd.get('tipo');
  i.unidade = fd.get('unidade');
  i.minimo = parseFloat(fd.get('minimo')) || 0;
  i.ncm = fd.get('ncm') || '';
  const novoSaldo = parseFloat(fd.get('saldo'));
  const novoCmp = parseFloat(fd.get('cmp'));
  const saldoMudou = Math.abs(novoSaldo - saldoAnt) > 0.0001;
  const cmpMudou = Math.abs(novoCmp - cmpAnt) > 0.000001;
  i.saldo = novoSaldo;
  i.cmp = novoCmp;
  if (saldoMudou || cmpMudou) {
    state.movimentos.unshift({
      id:'m'+uid(), insumoId, tipo:'AJUSTE_MANUAL',
      qtd: novoSaldo - saldoAnt, cmpAplicado: novoCmp, saldoApos: novoSaldo,
      data: new Date().toISOString(),
      obs: `Ajuste manual · saldo ${fmtNum(saldoAnt)} → ${fmtNum(novoSaldo)} · CMP ${fmtBRL(cmpAnt)} → ${fmtBRL(novoCmp)}`
    });
    logAuditoria('01_motor_cmp', 'AJUSTE_MANUAL', insumoId,
      `${i.nome}: saldo ${fmtNum(saldoAnt)} → ${fmtNum(novoSaldo)} · CMP ${fmtBRL(cmpAnt)} → ${fmtBRL(novoCmp)}`);
  }
  persistState();
  fecharModal();
  toast('Insumo atualizado');
  render();
}

function handleExcluirInsumo(insumoId) {
  const i = state.insumos.find(x => x.id === insumoId);
  if (!i) return;
  // Bloqueia se houver receita usando este insumo
  const usadoEm = state.receitas.filter(r => r.itens.some(it => it.insumoId === insumoId));
  if (usadoEm.length > 0) {
    toast(`Não é possível excluir: ${i.nome} é usado em ${usadoEm.length} ficha(s) técnica(s)`, 'erro');
    return;
  }
  if (!confirm(`Excluir "${i.nome}" definitivamente? Esta ação não pode ser desfeita.`)) return;
  state.insumos = state.insumos.filter(x => x.id !== insumoId);
  state.movimentos = state.movimentos.filter(m => m.insumoId !== insumoId);
  state.fornecedorInsumos = state.fornecedorInsumos.filter(fi => fi.insumoId !== insumoId);
  logAuditoria('01_motor_cmp', 'EXCLUSAO', insumoId, `Insumo "${i.nome}" excluído`);
  persistState();
  fecharModal();
  toast('Insumo excluído');
  render();
}

function estornarMovimento(movId) {
  const m = state.movimentos.find(x => x.id === movId);
  if (!m) return;
  const i = state.insumos.find(x => x.id === m.insumoId);
  if (!i) return;
  if (!confirm(`Estornar lançamento de ${fmtNum(Math.abs(m.qtd))} ${i.unidade}?\n\nO saldo e o CMP serão recalculados. Use para corrigir entradas erradas de NF-e.`)) return;

  // Para ENTRADA_NFE: reverte qtd e CMP usando média ponderada inversa
  if (m.tipo === 'ENTRADA_NFE' && m.qtd > 0) {
    const qtdRec = m.qtd, custoRec = m.cmpAplicado;
    const saldoAposEntrada = m.saldoApos;
    const cmpAposEntrada = i.cmp; // assume que é o CMP corrente (válido apenas se for o último lançamento)
    const saldoAntes = saldoAposEntrada - qtdRec;
    if (saldoAntes < 0) { toast('Não é possível estornar: saldo ficaria negativo', 'erro'); return; }
    // (saldoAntes × cmpAntes + qtdRec × custoRec) / saldoAposEntrada = cmpAposEntrada
    // cmpAntes = (cmpAposEntrada × saldoAposEntrada − qtdRec × custoRec) / saldoAntes
    let cmpAntes;
    if (saldoAntes === 0) {
      cmpAntes = 0;
    } else {
      cmpAntes = (cmpAposEntrada * saldoAposEntrada - qtdRec * custoRec) / saldoAntes;
      if (cmpAntes < 0) cmpAntes = cmpAposEntrada; // proteção contra arredondamento
    }
    i.saldo = i.saldo - qtdRec;
    i.cmp = cmpAntes;
  } else {
    // Estorno simples para saídas ou ajustes: apenas inverte a qtd
    i.saldo = i.saldo - m.qtd;
  }

  state.movimentos.unshift({
    id:'m'+uid(), insumoId: m.insumoId, tipo:'ESTORNO',
    qtd: -m.qtd, cmpAplicado: i.cmp, saldoApos: i.saldo,
    data: new Date().toISOString(),
    obs: `Estorno do lançamento de ${fmtDateTime(m.data)} · ${m.obs || ''}`
  });
  logAuditoria('01_motor_cmp', 'ESTORNO', m.insumoId,
    `${i.nome}: estorno de ${fmtNum(Math.abs(m.qtd))} ${i.unidade} · CMP recalc. ${fmtBRL(i.cmp)}`);
  persistState();
  fecharModal();
  toast('Lançamento estornado · saldo e CMP recalculados');
  render();
}

function abrirFichaTecnica(produtoId) {
  const p = state.produtos.find(x => x.id === produtoId);
  const r = state.receitas.find(rec => rec.produtoId === produtoId && rec.ativa);
  if (!r) { toast('Sem ficha cadastrada para este produto', 'erro'); return; }
  const custo = calcularCustoReceita(r.id);
  const precoUn = calcularPrecoSugerido(custo.custoTotal);
  const modoLabel = state.markup.modo === 'VALOR_MENSAL' ? 'composição R$/mês' : `markup ${(state.markup.df+state.markup.dv+state.markup.ml).toFixed(1)}%`;
  const precoPorGrama = p.pesoLiq > 0 ? precoUn / p.pesoLiq : 0;
  // Gera tabela a cada 50g até o peso unitário (e um pouco além para granel)
  const incrementos = [];
  const limite = Math.max(p.pesoLiq, 1000);
  for (let g = 50; g <= limite; g += 50) {
    incrementos.push({ g, preco: precoPorGrama * g, eUnidade: g === p.pesoLiq });
  }

  abrirModal(`
    <div class="flex items-start justify-between mb-1">
      <h2 class="font-display text-xl">${p.nome}</h2>
      <button class="btn text-xs" onclick="fecharModal(); abrirModalEditarFicha('${r.id}')">
        <i data-lucide="pencil" class="w-3 h-3"></i> Editar ficha
      </button>
    </div>
    <p class="text-sm text-stone-500 mb-4">Ficha técnica v${r.versao} · ${p.sku} · rendimento ${r.rendimentoUn} un / batelada · peso unitário ${p.pesoLiq}g</p>

    <table>
      <thead><tr>
        <th>Insumo</th><th class="text-right">Qtd</th>
        <th class="text-right">CMP</th><th class="text-right">Custo</th>
      </tr></thead>
      <tbody>
        ${custo.detalhes.map(d => `
          <tr>
            <td>${d.nome}</td>
            <td class="text-right num">${d.qtd} ${d.unidade}</td>
            <td class="text-right num">${fmtBRL(d.cmp)}</td>
            <td class="text-right num">${fmtBRL(d.custo)}</td>
          </tr>
        `).join('')}
        <tr><td colspan="3" class="text-right font-medium">Subtotal insumos</td>
          <td class="text-right num font-medium">${fmtBRL(custo.custoInsumos)}</td></tr>
        <tr><td colspan="3" class="text-right text-xs text-stone-600">MOD (${r.tempoH}h × ${fmtBRL(r.taxaMod)}/h)</td>
          <td class="text-right num text-xs">${fmtBRL(custo.custoMod)}</td></tr>
        <tr><td colspan="3" class="text-right text-xs text-stone-600">Depreciação rateada</td>
          <td class="text-right num text-xs">${fmtBRL(custo.custoDepreciacao)}</td></tr>
        <tr class="bg-brand-purple-50"><td colspan="3" class="text-right font-display font-medium">Custo total unitário</td>
          <td class="text-right num font-display font-medium">${fmtBRL(custo.custoTotal)}</td></tr>
      </tbody>
    </table>

    <div class="mt-5 p-4 bg-brand-teal-50 rounded-md">
      <div class="flex items-center justify-between mb-3">
        <div>
          <p class="module-tag text-brand-teal-900">PREÇO SUGERIDO</p>
          <p class="text-xs text-brand-teal-900 mt-1">Cálculo: ${modoLabel}</p>
        </div>
        <div class="text-right">
          <p class="text-xs text-brand-teal-900">Por unidade (${p.pesoLiq}g)</p>
          <p class="num font-display text-2xl text-brand-teal-900">${fmtBRL(precoUn)}</p>
          <p class="text-xs text-brand-teal-900 num">${fmtBRL(precoPorGrama)}/g</p>
        </div>
      </div>
      <p class="text-xs font-medium text-brand-teal-900 mb-2">Tabela por gramatura (a cada 50g) — útil para vendas a granel e ajuste pós-fornada:</p>
      <div class="grid grid-cols-5 gap-2 text-xs">
        ${incrementos.map(inc => `
          <div class="${inc.eUnidade ? 'bg-brand-teal-600 text-white' : 'bg-white'} rounded p-2 text-center border border-brand-teal-600/20">
            <p class="${inc.eUnidade ? 'text-white' : 'text-brand-teal-900'} text-[10px]">${inc.g}g${inc.eUnidade ? ' · unid.' : ''}</p>
            <p class="num font-medium ${inc.eUnidade ? 'text-white' : ''}">${fmtBRL(inc.preco)}</p>
          </div>
        `).join('')}
      </div>
    </div>

    <p class="text-xs text-stone-500 mt-3">💡 Após a fornada, se o peso unitário real for diferente do planejado, edite "peso unitário" no produto para recalcular automaticamente os preços por grama.</p>
    <div class="text-right mt-4"><button class="btn" onclick="fecharModal()">Fechar</button></div>
  `, 'lg');
}

  state.produtos = state.produtos.filter(x => x.id !== produtoId);
  state.receitas = state.receitas.filter(r => r.produtoId !== produtoId);
  state.ordens = state.ordens.filter(o => o.produtoId !== produtoId);
  logAuditoria('02_produtos', 'EXCLUSAO', produtoId, `Produto "${p.nome}" excluído`);

          ${itensIniciais.length > 0
            ? itensIniciais.map((it, idx) => renderItemFichaRow(idx, it)).join('')

function renderItemFichaRow(idx, item) {
  return `
    <div class="grid grid-cols-12 gap-2 items-end ficha-item">

        <select name="insumoId_${idx}" required class="input text-xs ficha-insumo">
          ${state.insumos.map(i => `<option value="${i.id}" ${item?.insumoId===i.id?'selected':''}>${i.nome} (${i.unidade})</option>`).join('')}
        </select>
      </div>
      <div class="col-span-3">
        <input name="qtd_${idx}" type="number" step="0.001" min="0.001" required placeholder="Qtd" class="input text-xs" value="${item?.qtd ?? ''}">
      </div>
      <div class="col-span-1 text-xs text-stone-500 pb-2 ficha-unidade">${item ? state.insumos.find(i=>i.id===item.insumoId)?.unidade : ''}</div>
      <button type="button" class="col-span-1 btn text-xs btn-danger" onclick="this.parentElement.remove()">
        <i data-lucide="x" class="w-3 h-3"></i>
      </button>

let _itemFichaIdx = 0;
function addItemFicha() {
  _itemFichaIdx++;
  const div = document.createElement('div');
  div.innerHTML = renderItemFichaRow(_itemFichaIdx, null);
  document.getElementById('ficha-itens').appendChild(div.firstElementChild);
  if (typeof lucide!=='undefined') lucide.createIcons();
}

function handleSalvarFicha(ev, receitaId) {
  ev.preventDefault();
  const form = ev.target;
  const fd = new FormData(form);
  const itens = [];
  document.querySelectorAll('#ficha-itens .ficha-item').forEach(row => {
    const insumoId = row.querySelector('[name^="insumoId"]').value;
    const qtd = parseFloat(row.querySelector('[name^="qtd"]').value);
    if (insumoId && qtd > 0) {
      const ins = state.insumos.find(i => i.id === insumoId);
      itens.push({ insumoId, qtd, unidade: ins.unidade });
    }
  });
  if (itens.length === 0) { toast('Adicione pelo menos um insumo', 'erro'); return; }

  const produtoId = fd.get('produtoId');
  const rendimentoUn = parseInt(fd.get('rendimentoUn'));
  const tempoH = parseFloat(fd.get('tempoH'));
  const taxaMod = parseFloat(fd.get('taxaMod'));
  const depreciacao = parseFloat(fd.get('depreciacao'));

  if (receitaId) {
    // Editando: cria nova versão, desativa a anterior
    const antiga = state.receitas.find(x => x.id === receitaId);
    if (antiga) antiga.ativa = false;
    const novaVersao = (antiga?.versao || 1) + 1;
    state.receitas.push({
      id:'r'+uid(), produtoId, versao: novaVersao,
      rendimentoUn, tempoH, taxaMod, depreciacao,
      ativa:true, criadoEm: todayISO(), itens
    });
    logAuditoria('02_produtos', 'FICHA_NOVA_VERSAO', produtoId,
      `Ficha do produto atualizada → v${novaVersao}`);
    toast(`Nova versão da ficha (v${novaVersao}) salva · versão anterior preservada no histórico`);
  } else {
    state.receitas.push({
      id:'r'+uid(), produtoId, versao:1,
      rendimentoUn, tempoH, taxaMod, depreciacao,
      ativa:true, criadoEm: todayISO(), itens
    });
    logAuditoria('02_produtos', 'FICHA_CRIADA', produtoId, `Ficha técnica criada`);
    toast('Ficha técnica criada');
  }
  persistState();
  fecharModal();
  render();
}

function renderMarkup() {
  const m = state.markup;
  const modoValor = m.modo === 'VALOR_MENSAL';

  // Bloco fixo da embalagem (independe de ter produto cadastrado)
  const blocoEmbalagem = `
    <div class="card mb-4">
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1">
          <h3 class="font-display text-lg">Markup das embalagens vendidas</h3>
          <p class="text-xs text-stone-500">Acréscimo % aplicado sobre o CMP da embalagem quando vendida ao cliente (cenário "+ Embalagem do estoque" no novo pedido). Não afeta o markup do produto.</p>
        </div>
        <div class="text-center" style="min-width:160px;">
          <p class="num text-2xl font-display">${m.markupEmbalagem}%</p>
          <input type="range" min="0" max="100" step="1" value="${m.markupEmbalagem}"
            oninput="state.markup.markupEmbalagem=parseInt(this.value); persistState(); render()"
            class="w-full mt-1" style="accent-color:#1D9E75;">
          <p class="text-[10px] text-stone-500 mt-1">CMP × ${(1 + m.markupEmbalagem/100).toFixed(2)}</p>
        </div>
      </div>
    </div>
  `;

  // Se não há produtos, mostra só o bloco da embalagem
  if (state.produtos.length === 0) {
    return `
      ${pageHeader('03', 'PRECIFICAÇÃO', 'Composição do preço sugerido')}
      ${blocoEmbalagem}
      <div class="card text-center text-stone-500 py-8">
        <p class="text-sm">Cadastre produtos no módulo 2 para configurar markup e simular preços.</p>
      </div>
    `;
  }

  const produtoSelecionado = window._mkProdutoId || state.produtos[0].id;
  const p = state.produtos.find(x => x.id === produtoSelecionado) || state.produtos[0];
  const r = state.receitas.find(rec => rec.produtoId === p.id && rec.ativa);
  const custo = r ? calcularCustoReceita(r.id) : null;

  const calc = custo ? (modoValor
    ? calcularComposicaoValor(custo.custoTotal, m)
    : calcularMarkup(m.df, m.dv, m.ml, custo.custoTotal)) : null;

  return `
    ${pageHeader('03', 'PRECIFICAÇÃO', 'Composição do preço sugerido')}
    ${blocoEmbalagem}

    <div class="card mb-4 flex items-center justify-between gap-4">
      <div class="flex-1">
        <label class="text-xs text-stone-600">Produto para precificar</label>
        <select class="input mt-1" onchange="window._mkProdutoId=this.value; render()">
          ${state.produtos.map(pp => `<option value="${pp.id}" ${pp.id===produtoSelecionado?'selected':''}>${pp.nome} (${pp.sku})</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="text-xs text-stone-600">Modo de cálculo</label>
        <div class="flex gap-1 mt-1">
          <button class="btn text-xs ${!modoValor ? 'btn-primary' : ''}" onclick="state.markup.modo='PERCENTUAL'; persistState(); render()">
            <i data-lucide="percent" class="w-3 h-3"></i> Percentual
          </button>
          <button class="btn text-xs ${modoValor ? 'btn-primary' : ''}" onclick="state.markup.modo='VALOR_MENSAL'; persistState(); render()">
            <i data-lucide="banknote" class="w-3 h-3"></i> Valor (R$/mês)
          </button>
        </div>
      </div>
    </div>

    ${modoValor ? renderModoValor(m, custo, calc, p) : renderModoPercentual(m, custo, calc, p)}
  `;
}

function renderModoPercentual(m, custo, calc, p) {
  return `
    <div class="grid grid-cols-3 gap-3 mb-4">
      ${renderSliderCard('Despesas fixas (%DF)', 'df', m.df, 'purple', 'aluguel, energia, internet, salários')}
      ${renderSliderCard('Despesas variáveis (%DV)', 'dv', m.dv, 'coral', 'impostos, taxas, comissões, frete')}
      ${renderSliderCard('Margem líquida (%ML)', 'ml', m.ml, 'teal', 'lucro real desejado')}
    </div>

    ${calc?.erro ? `<div class="danger-banner mb-4">${calc.erro}</div>` : ''}

    ${custo && calc && !calc.erro ? renderResultadoPreco(custo, calc, p, 'PERCENTUAL') : ''}
  `;
}

function renderModoValor(m, custo, calc, p) {
  const prodMensal = Math.max(Number(m.producaoMensal) || 0, 1);
  const cfUn = (Number(m.custoFixoMes) || 0) / prodMensal;
  const cvUn = (Number(m.custoVariavelMes) || 0) / prodMensal;
  const mlUn = (Number(m.margemLiquidaMes) || 0) / prodMensal;

  return `
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 class="font-display text-lg">Produção mensal estimada</h3>
          <p class="text-xs text-stone-500">Quantidade de unidades produzidas/vendidas no mês — base do rateio</p>
        </div>
        <div class="flex items-center gap-2">
          <input id="prodMensalInput" type="number" min="1" step="1" value="${m.producaoMensal}"
            class="input num text-right" style="width:140px;"
            onchange="state.markup.producaoMensal=parseFloat(this.value)||1; persistState(); render()">
          <span class="text-xs text-stone-500">un/mês</span>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3 mb-4">
      ${renderValorCard('Despesas fixas mensais', 'custoFixoMes', m.custoFixoMes, cfUn, 'purple', 'aluguel, energia, salários, internet')}
      ${renderValorCard('Despesas variáveis mensais', 'custoVariavelMes', m.custoVariavelMes, cvUn, 'coral', 'impostos, comissões, frete, taxas')}
      ${renderValorCard('Margem líquida desejada/mês', 'margemLiquidaMes', m.margemLiquidaMes, mlUn, 'teal', 'lucro alvo mensal')}
    </div>

    ${custo && calc ? renderResultadoPreco(custo, calc, p, 'VALOR_MENSAL') : ''}
  `;
}

    <div class="card">
      <div class="flex items-baseline justify-between mb-2">

          <div class="grid grid-cols-5 gap-2 text-xs">
            <div class="p-2 bg-white rounded border border-stone-200">
              <p class="text-stone-500 text-[10px]">Ficha técnica</p>
              <p class="num font-medium">${fmtBRL(custo.custoTotal)}</p>
            </div>

        ${tipo === 'ENCOMENDA' ? 'encomenda' : 'pronta entrega'}
      </span>
    </div>
    <p class="text-sm text-stone-500 mb-4">${cli.nome} · ${cli.tipo} · ${cli.cidade}</p>

    <table>
      <thead><tr><th>Produto</th><th>Embalagem</th><th class="text-right">Gramatura</th><th class="text-right">Pacotes</th><th class="text-right">Preço un.</th><th class="text-right">Subtotal</th><th class="text-right">Equiv. embal.</th></tr></thead>
      <tbody>
        ${p.itens.map(i => {
          const prod = i.produtoId ? state.produtos.find(x => x.id === i.produtoId) : null;
          const gramatura = i.gramatura || prod?.pesoLiq || 0;
          const unEq = prod ? (i.qtd * gramatura) / (prod.pesoLiq || 500) : 0;
          const emb = i.embalagemId ? state.insumos.find(x => x.id === i.embalagemId) : null;
          const embLabel = emb
            ? `<span class="text-xs">${emb.nome}</span>`
            : `<span class="text-xs text-stone-400">— fracionado —</span>`;
          // Nome a exibir: se tem produto, é o produto. Se não, é "Embalagem vazia (nome da embalagem)".
          const nomeExibir = prod
            ? `<strong>${prod.nome}</strong> <span class="text-xs text-stone-500 block">${prod.sku}</span>`
            : `<em class="text-stone-500">${emb?.nome || 'Embalagem'}</em> <span class="text-xs text-stone-400 block">só embalagem</span>`;
          return `
            <tr>
              <td>${nomeExibir}</td>
              <td>${embLabel}</td>
              <td class="text-right num">${gramatura > 0 ? gramatura + 'g' : '—'}</td>
              <td class="text-right num">${i.qtd}</td>
              <td class="text-right num">${fmtBRL(i.preco)}</td>
              <td class="text-right num font-medium">${fmtBRL(i.qtd * i.preco)}</td>
              <td class="text-right num text-xs text-stone-500">${prod ? fmtNum(unEq, 2) + ' un' : '—'}</td>
            </tr>
          `;
        }).join('')}
        <tr><td colspan="5" class="text-right text-xs text-stone-600">Subtotal dos itens</td>
          <td class="text-right num text-xs">${fmtBRL(p.subtotal || p.total)}</td>
          <td></td></tr>
        ${Math.abs(p.bonificacao || 0) > 0.005 ? `
        <tr><td colspan="5" class="text-right text-xs ${p.bonificacao > 0 ? 'text-brand-amber-900' : 'text-brand-purple-900'}">
          ${p.bonificacao > 0 ? '(+) Bonificação recebida (arredondamento)' : '(−) Bonificação concedida (arredondamento)'}
        </td>
          <td class="text-right num text-xs ${p.bonificacao > 0 ? 'text-brand-amber-900' : 'text-brand-purple-900'}">${p.bonificacao > 0 ? '+' : '−'}${fmtBRL(Math.abs(p.bonificacao))}</td>
          <td></td></tr>
        ` : ''}
        <tr class="bg-brand-purple-50"><td colspan="5" class="text-right font-display">Total cobrado</td>
          <td class="text-right num font-display font-medium">${fmtBRL(p.total)}</td>
          <td class="text-right num text-xs">${fmtBRL(p.custoSnapshot)} custo</td></tr>
        <tr><td colspan="6" class="text-right text-xs text-stone-600">Margem do pedido</td>
          <td class="text-right num text-xs font-medium text-brand-teal-900">${((1 - p.custoSnapshot/p.total)*100).toFixed(1)}%</td></tr>
      </tbody>
    </table>

    ${opsVinculadas.length > 0 ? `
      <div class="mt-4">
        <p class="text-xs font-medium mb-2">Ordens de produção vinculadas</p>
        <div class="space-y-1">
          ${opsVinculadas.map(o => {
            const prod = state.produtos.find(x => x.id === o.produtoId);
            return `<div class="flex items-center justify-between p-2 bg-brand-amber-50 rounded text-xs">
              <span><strong>OP-${o.numero}</strong> · ${prod?.nome || '—'} · ${o.tamanhoLote} un</span>
              <span class="badge bg-white text-[10px]">${o.status.toLowerCase().replace('_',' ')}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    ` : ''}

    <div class="mt-3 p-3 bg-stone-50 rounded text-xs space-y-1">
      <p><span class="text-stone-500">Tipo:</span> ${tipo === 'ENCOMENDA' ? 'Encomenda (produção sob demanda)' : 'Pronta entrega (do estoque)'}</p>
      <p><span class="text-stone-500">Canal:</span> ${p.canal}</p>
      <p><span class="text-stone-500">Forma de pagamento:</span> ${p.formaPagto || '<span class="text-stone-400">— não definida —</span>'}</p>
      <p><span class="text-stone-500">Prazo:</span> ${p.prazoDias ? `${p.prazoDias} dias` : 'à vista'}</p>
      <p><span class="text-stone-500">Criado em:</span> ${fmtDateTime(p.criadoEm)}</p>
      <p><span class="text-stone-500">Entrega prometida:</span> ${fmtDate(p.dataEntrega)}</p>
      <p><span class="text-stone-500">Custo snapshot:</span> ${fmtBRL(p.custoSnapshot)} (congelado no momento da confirmação)</p>
      ${p.statusComercial === 'CANCELADO' ? `<p class="mt-2 text-brand-coral-900"><strong>Cancelado em:</strong> ${p.canceladoEm ? fmtDateTime(p.canceladoEm) : '—'}<br><strong>Motivo:</strong> ${p.motivoCancelamento || '—'}</p>` : ''}
    </div>
    <div class="flex justify-between gap-2 mt-4">
      <div class="flex gap-2">
        ${['RASCUNHO','CONFIRMADO'].includes(p.statusComercial) ? `<button class="btn" onclick="fecharModal(); editarPedido('${p.id}')"><i data-lucide="edit-2" class="w-3 h-3"></i> Editar</button>` : ''}
        ${p.statusComercial !== 'CANCELADO' ? `<button class="btn btn-danger" onclick="cancelarPedido('${p.id}')"><i data-lucide="x" class="w-3 h-3"></i> Cancelar pedido</button>` : ''}
      </div>
      <button class="btn" onclick="fecharModal()">Fechar</button>
    </div>
  `, 'lg');
  if (typeof lucide!=='undefined') lucide.createIcons();
}

// ----- Adicionar item: EMBALAGEM DO ESTOQUE (só a embalagem, independente) -----
function addItemPedidoEmbalagem() {
  const embalagensComSaldo = state.insumos.filter(i =>
    ['EMBALAGEM_PRIMARIA','EMBALAGEM_SECUNDARIA','EMBALAGEM_PROPORCIONAL'].includes(i.tipo) && i.saldo > 0
  );
  if (embalagensComSaldo.length === 0) {
    toast('Nenhuma embalagem com saldo em estoque · cadastre no módulo de insumos primeiro', 'erro');
    return;
  }
  const idx = ++window._pedItemIdx;
  const embInicial = embalagensComSaldo[0];
  const precoInicial = precoSugeridoEmbalagem(embInicial.id);
  const row = document.createElement('div');
  row.className = 'pedido-item';
  row.dataset.idx = idx;
  row.dataset.modo = 'EMBALAGEM';
  row.innerHTML = renderItemEmbalagem(idx, embInicial.id, 1, precoInicial);
  document.getElementById('pedido-itens').appendChild(row);
  document.getElementById('pedido-itens-vazio').style.display = 'none';
  if (typeof lucide!=='undefined') lucide.createIcons();
  atualizarResumoPedido();
}

// Preço sugerido = CMP da embalagem × (1 + markupEmbalagem/100)
function precoSugeridoEmbalagem(embalagemId) {
  const emb = state.insumos.find(i => i.id === embalagemId);
  if (!emb) return 0;
  const markupEmb = 1 + (Number(state.markup.markupEmbalagem) || 30) / 100;
  return Math.round((Number(emb.cmp) || 0) * markupEmb * 10) / 10; // arredonda a R$ 0,10
}

function renderItemEmbalagem(idx, embalagemId, qtd, preco) {
  const embalagensComSaldo = state.insumos.filter(i =>
    ['EMBALAGEM_PRIMARIA','EMBALAGEM_SECUNDARIA','EMBALAGEM_PROPORCIONAL'].includes(i.tipo) && i.saldo > 0
  );
  const emb = state.insumos.find(i => i.id === embalagemId);
  const tipoLabel = {
    'EMBALAGEM_PRIMARIA':'primária',
    'EMBALAGEM_SECUNDARIA':'secundária',
    'EMBALAGEM_PROPORCIONAL':'proporcional'
  }[emb?.tipo] || '';
  const markupEmb = Number(state.markup.markupEmbalagem) || 30;
  const cmpEmb = Number(emb?.cmp) || 0;
  const valorComMarkup = cmpEmb * (1 + markupEmb/100);
  const margemPct = preco > 0 ? ((preco - cmpEmb) / preco) * 100 : 0;

  return `
    <div class="border rounded-md p-3" style="border-color:#1D9E75; background:#E1F5EE;">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] uppercase tracking-wider font-medium" style="color:#04342C;">
          <i data-lucide="package" class="w-3 h-3 inline"></i> Embalagem do estoque · item #${idx}
        </span>
        <button type="button" class="btn btn-danger text-xs" onclick="removerItemPedido(${idx})">
          <i data-lucide="x" class="w-3 h-3"></i>
        </button>
      </div>

      <div class="grid gap-2 mb-2" style="grid-template-columns: 1fr 90px;">
        <div>
          <p class="text-[10px]" style="color:#04342C;">Embalagem (insumo em estoque)</p>
          <select name="embalagemId_${idx}" class="input text-xs"
            onchange="recalcularPrecoEmbalagem(${idx})">
            ${embalagensComSaldo.map(e => `
              <option value="${e.id}" ${e.id===embalagemId?'selected':''}>${e.nome} — ${fmtNum(e.saldo,0)} ${e.unidade} disp. (${ {EMBALAGEM_PRIMARIA:'prim.',EMBALAGEM_SECUNDARIA:'sec.',EMBALAGEM_PROPORCIONAL:'prop.'}[e.tipo] || ''})</option>
            `).join('')}
          </select>
        </div>
        <div>
          <p class="text-[10px]" style="color:#04342C;">Saldo emb.</p>
          <p class="num font-medium text-sm" style="color:#04342C; padding-top:6px;">${fmtNum(emb?.saldo || 0, 0)} ${emb?.unidade || 'un'}</p>
        </div>
      </div>

      <input type="hidden" name="produtoId_${idx}" value="">
      <input type="hidden" name="gramatura_${idx}" value="0">
      <input type="hidden" name="modo_${idx}" value="EMBALAGEM">

      <div class="grid gap-2" style="grid-template-columns: 90px 130px 1fr;">
        <div>
          <p class="text-[10px]" style="color:#04342C;">Pacotes</p>
          <input name="qtd_${idx}" type="number" min="1" step="1" value="${qtd}" class="input text-xs"
            oninput="atualizarResumoPedido(); atualizarSubtotalItem(${idx});">
        </div>
        <div>
          <p class="text-[10px]" style="color:#04342C;">Preço unit.</p>
          <input name="preco_${idx}" type="number" min="0" step="0.01" value="${preco > 0 ? preco.toFixed(2) : ''}" class="input text-xs"
            oninput="atualizarResumoPedido(); atualizarSubtotalItem(${idx});">
        </div>
        <div class="text-right">
          <p class="text-[10px]" style="color:#04342C;">Subtotal</p>
          <p class="num font-medium text-sm" id="subtotal-${idx}" style="color:#04342C; padding-top:6px;">${fmtBRL(qtd * preco)}</p>
        </div>
      </div>

      <p class="text-[11px] mt-2" id="composicao-emb-${idx}" style="color:#0F6E56;">
        <i data-lucide="info" class="w-3 h-3 inline"></i>
        ${tipoLabel} · CMP ${fmtBRL(cmpEmb)} × ${(1+markupEmb/100).toFixed(2)} = ${fmtBRL(valorComMarkup)} sugerido · margem ${margemPct.toFixed(1)}%
      </p>
    </div>
  `;
}

function recalcularPrecoEmbalagem(idx) {
  const row = document.querySelector(`.pedido-item[data-idx="${idx}"]`);
  if (!row) return;
  const embId = row.querySelector(`[name="embalagemId_${idx}"]`).value;
  const qtd = parseFloat(row.querySelector(`[name="qtd_${idx}"]`).value) || 1;
  const precoSugerido = precoSugeridoEmbalagem(embId);
  row.innerHTML = renderItemEmbalagem(idx, embId, qtd, precoSugerido);
  if (typeof lucide!=='undefined') lucide.createIcons();
  atualizarResumoPedido();
}


// ----- Adicionar item: FRACIONADO (granel com chips) ------------------------
function addItemPedidoFracionado() {
  if (state.produtos.length === 0) {
    toast('Cadastre ao menos um produto no módulo 2 antes de criar pedidos', 'erro');
    return;
  }
  const idx = ++window._pedItemIdx;
  const prodInicial = state.produtos[0];
  if (!prodInicial) return;
  const row = document.createElement('div');
  row.className = 'pedido-item';
  row.dataset.idx = idx;
  row.dataset.modo = 'FRACIONADO';
  row.innerHTML = renderItemFracionado(idx, prodInicial.id, null, 1, 0);
  document.getElementById('pedido-itens').appendChild(row);
  document.getElementById('pedido-itens-vazio').style.display = 'none';
  if (typeof lucide!=='undefined') lucide.createIcons();
  // Pré-selecionar a gramatura da embalagem completa por padrão
  selecionarGramatura(idx, prodInicial.pesoLiq);
}

function renderItemFracionado(idx, produtoId, gramatura, qtd, preco) {
  const prod = state.produtos.find(p => p.id === produtoId);
  const r = state.receitas.find(rec => rec.produtoId === produtoId && rec.ativa);
  const custo = r ? calcularCustoReceita(r.id) : null;
  const precoEmbCompleta = custo ? calcularPrecoSugerido(custo.custoTotal) : 0;
  const precoPorG = prod?.pesoLiq > 0 ? precoEmbCompleta / prod.pesoLiq : 0;
  return `
    <div class="border border-stone-200 rounded-md p-3">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] uppercase tracking-wider font-medium text-stone-600">

          <i data-lucide="x" class="w-3 h-3"></i>

      <p class="text-[10px] text-stone-500 mb-1">Produto</p>
      <select name="produtoId_${idx}" class="input text-xs mb-2"
        onchange="recalcularItemFracionado(${idx})">
        ${state.produtos.map(p => `<option value="${p.id}" ${p.id===produtoId?'selected':''}>${p.nome} (saldo ${fmtNum(p.saldoPa,2)})</option>`).join('')}
      </select>

      <div class="flex items-baseline justify-between mb-1">
        <p class="text-[10px] text-stone-500">Escolha a gramatura — preço já calculado (custo + margem)</p>
        <p class="text-[10px] text-stone-500 num">${fmtBRL(precoPorG)} / g</p>
      </div>
      <div id="chips-${idx}" class="grid gap-1.5 mb-2" style="grid-template-columns: repeat(6, 1fr);">
        ${renderChipsGramatura(idx, prod, precoPorG, gramatura)}
      </div>
      <input type="hidden" name="gramatura_${idx}" value="${gramatura || ''}">
      <input type="hidden" name="modo_${idx}" value="FRACIONADO">

      <div class="grid gap-2" style="grid-template-columns: 100px 140px 1fr;">
        <div>
          <p class="text-[10px] text-stone-500">Pacotes</p>
          <input name="qtd_${idx}" type="number" min="1" step="1" value="${qtd}" class="input text-xs"
            oninput="atualizarResumoPedido(); atualizarSubtotalItem(${idx})">
        </div>
        <div>
          <p class="text-[10px] text-stone-500">Preço unit. (editável)</p>
          <input name="preco_${idx}" type="number" min="0" step="0.01" value="${preco > 0 ? preco.toFixed(2) : ''}" class="input text-xs"
            oninput="atualizarResumoPedido(); atualizarSubtotalItem(${idx})">
        </div>
        <div class="text-right">
          <p class="text-[10px] text-stone-500">Subtotal</p>
          <p class="num font-medium text-sm" id="subtotal-${idx}" style="padding-top:6px;">${fmtBRL(qtd * preco)}</p>
        </div>
      </div>

      <div id="composicao-${idx}" class="bg-stone-50 rounded-md px-3 py-2 mt-2 text-xs flex justify-between items-center">
        <span class="text-stone-600">Selecione uma gramatura</span>
      </div>
    </div>
  `;
}

function renderChipsGramatura(idx, prod, precoPorG, selecionada) {
  if (!prod) return '';
  const peso = prod.pesoLiq || 500;
  const chips = [];
  // Fracionários de 50 em 50 até a embalagem
  for (let g = 50; g <= peso; g += 50) {
    const preco = Math.round((precoPorG * g) * 10) / 10;
    const ePesoCompleto = g === peso;
    chips.push({ g, preco, label: g + 'g', sub: ePesoCompleto ? 'embal.' : '', destaque: ePesoCompleto });
  }
  // Múltiplos da embalagem
  [2,3,4,5].forEach(m => {
    const g = peso * m;
    const preco = Math.round((precoPorG * g) * 10) / 10;
    chips.push({ g, preco, label: g + 'g', sub: m + '× embal.', destaque: false });
  });
  return chips.map(c => {
    const ativo = selecionada && selecionada == c.g;
    let style = 'cursor:pointer;';
    if (ativo) {
      style += 'border:2px solid #534AB7; background:#EEEDFE; padding:6px 4px;';
    } else if (c.destaque) {
      style += 'border:1px solid #1D9E75; background:#E1F5EE; padding:7px 4px;';
    } else {
      style += 'border:1px solid #D9D5CE; padding:7px 4px;';
    }
    style += ' border-radius:6px; text-align:center;';
    const corLabel = ativo ? '#26215C' : (c.destaque ? '#04342C' : '#1F1E1D');
    const corPreco = ativo ? '#534AB7' : (c.destaque ? '#0F6E56' : '#6B6967');
    return `
      <div class="chip-gramatura" style="${style}"
        onclick="selecionarGramatura(${idx}, ${c.g}, ${c.preco})">
        <p class="text-xs font-medium" style="color:${corLabel}; margin:0;">${c.label}${ativo ? ' ✓' : ''}</p>
        <p class="text-[10px] num" style="color:${corPreco}; margin:1px 0 0;">${fmtBRL(c.preco)}</p>
        ${c.sub ? `<p class="text-[9px]" style="color:${corPreco}; margin:0;">${c.sub}</p>` : ''}
      </div>
    `;
  }).join('');
}

function selecionarGramatura(idx, gramatura, precoSugerido) {
  const row = document.querySelector(`.pedido-item[data-idx="${idx}"]`);
  if (!row) return;
  const selProd = row.querySelector(`[name="produtoId_${idx}"]`);
  const prod = state.produtos.find(p => p.id === selProd.value);
  if (!prod) return;
  const r = state.receitas.find(rec => rec.produtoId === prod.id && rec.ativa);
  const custo = r ? calcularCustoReceita(r.id) : null;
  const precoEmbCompleta = custo ? calcularPrecoSugerido(custo.custoTotal) : 0;
  const precoPorG = prod.pesoLiq > 0 ? precoEmbCompleta / prod.pesoLiq : 0;
  // Se não foi passado preço, calcular
  if (typeof precoSugerido !== 'number') {
    precoSugerido = Math.round((precoPorG * gramatura) * 10) / 10;
  }
  // Atualizar hidden + preço
  row.querySelector(`[name="gramatura_${idx}"]`).value = gramatura;
  row.querySelector(`[name="preco_${idx}"]`).value = precoSugerido.toFixed(2);
  // Re-renderizar os chips para refletir seleção
  document.getElementById(`chips-${idx}`).innerHTML = renderChipsGramatura(idx, prod, precoPorG, gramatura);
  atualizarComposicaoFracionado(idx);
  atualizarSubtotalItem(idx);
  atualizarResumoPedido();
}

function atualizarComposicaoFracionado(idx) {
  const row = document.querySelector(`.pedido-item[data-idx="${idx}"]`);
  if (!row) return;
  const box = document.getElementById(`composicao-${idx}`);
  if (!box) return;
  const selProd = row.querySelector(`[name="produtoId_${idx}"]`);
  const prod = state.produtos.find(p => p.id === selProd.value);
  const gramatura = parseFloat(row.querySelector(`[name="gramatura_${idx}"]`).value) || 0;
  const preco = parseFloat(row.querySelector(`[name="preco_${idx}"]`).value) || 0;
  if (!prod || !gramatura || !preco) {
    box.innerHTML = '<span class="text-stone-600">Selecione uma gramatura</span>';
    return;
  }
  const r = state.receitas.find(rec => rec.produtoId === prod.id && rec.ativa);
  const custo = r ? calcularCustoReceita(r.id) : null;
  const custoUn = custo ? custo.custoTotal * (gramatura / (prod.pesoLiq || 500)) : 0;
  const margemRS = preco - custoUn;
  const margemPct = preco > 0 ? (margemRS / preco) * 100 : 0;
  const unEq = gramatura / (prod.pesoLiq || 500);
  // Comparar com margem alvo (ML configurado em %, ou margem mínima 10%)
  const margemAlvo = (state.markup.modo === 'PERCENTUAL') ? state.markup.ml : 20;
  let selo, corSelo, corBg;
  if (margemPct < 0) {
    selo = 'PREJUÍZO'; corSelo = '#501313'; corBg = '#FCEBEB';
  } else if (margemPct < margemAlvo) {
    selo = 'abaixo da meta'; corSelo = '#412402'; corBg = '#FAEEDA';
  } else {
    selo = 'margem ok'; corSelo = '#04342C'; corBg = '#E1F5EE';
  }
  box.innerHTML = `
    <span class="text-stone-600">Composição: custo ${fmtBRL(custoUn)}/un · margem ${fmtBRL(margemRS)} (${margemPct.toFixed(1)}%) · ${gramatura}g = ${fmtNum(unEq,2)} embal.</span>
    <span style="background:${corBg}; color:${corSelo}; padding:2px 8px; border-radius:4px; font-weight:500; font-size:11px;">${selo}</span>
  `;
}

function atualizarSubtotalItem(idx) {
  const row = document.querySelector(`.pedido-item[data-idx="${idx}"]`);
  if (!row) return;
  const qtd = parseFloat(row.querySelector(`[name="qtd_${idx}"]`).value) || 0;
  const preco = parseFloat(row.querySelector(`[name="preco_${idx}"]`).value) || 0;
  const sub = document.getElementById(`subtotal-${idx}`);
  if (sub) sub.textContent = fmtBRL(qtd * preco);
  if (row.dataset.modo === 'FRACIONADO') atualizarComposicaoFracionado(idx);
}

function recalcularItemFracionado(idx) {
  const row = document.querySelector(`.pedido-item[data-idx="${idx}"]`);
  if (!row) return;
  const produtoId = row.querySelector(`[name="produtoId_${idx}"]`).value;
  const prod = state.produtos.find(p => p.id === produtoId);
  if (!prod) return;
  const r = state.receitas.find(rec => rec.produtoId === prod.id && rec.ativa);
  const custo = r ? calcularCustoReceita(r.id) : null;
  const precoEmbCompleta = custo ? calcularPrecoSugerido(custo.custoTotal) : 0;
  const precoPorG = prod.pesoLiq > 0 ? precoEmbCompleta / prod.pesoLiq : 0;
  // Renderiza chips do novo produto, pré-seleciona embalagem completa
  document.getElementById(`chips-${idx}`).innerHTML = renderChipsGramatura(idx, prod, precoPorG, prod.pesoLiq);
  // Atualiza hidden gramatura e preço default
  row.querySelector(`[name="gramatura_${idx}"]`).value = prod.pesoLiq;
  row.querySelector(`[name="preco_${idx}"]`).value = (Math.round(precoEmbCompleta * 10) / 10).toFixed(2);
  atualizarSubtotalItem(idx);
  atualizarResumoPedido();
}

function removerItemPedido(idx) {
  const row = document.querySelector(`.pedido-item[data-idx="${idx}"]`);
  if (row) row.remove();
  const restantes = document.querySelectorAll('.pedido-item').length;
  if (restantes === 0) {
    document.getElementById('pedido-itens-vazio').style.display = 'block';
  }
  atualizarResumoPedido();
}

// ----- Resumo do pedido com arredondamento e bonificação --------------------
function atualizarResumoPedido() {
  // Calcula subtotal dos itens
  let subtotal = 0, custo = 0;
  document.querySelectorAll('.pedido-item').forEach(row => {
    const idx = row.dataset.idx;
    const produtoId = row.querySelector(`[name="produtoId_${idx}"]`)?.value;
    const gramatura = parseFloat(row.querySelector(`[name="gramatura_${idx}"]`)?.value) || 0;
    const qtd = parseFloat(row.querySelector(`[name="qtd_${idx}"]`)?.value) || 0;
    const preco = parseFloat(row.querySelector(`[name="preco_${idx}"]`)?.value) || 0;
    subtotal += qtd * preco;
    const prod = state.produtos.find(p => p.id === produtoId);
    const r = state.receitas.find(rec => rec.produtoId === produtoId && rec.ativa);
    if (prod && r && gramatura > 0) {
      const c = calcularCustoReceita(r.id);
      const fator = gramatura / (prod.pesoLiq || 500);
      custo += c.custoTotal * fator * qtd;
    }
  });

  // Atualizar chips de arredondamento
  const chipsBox = document.getElementById('chips-arredondar');
  if (chipsBox) {
    if (subtotal > 0) {
      const sugestoes = sugerirArredondamentos(subtotal);
      chipsBox.innerHTML = sugestoes.map(s => `
        <button type="button" class="btn text-[11px] py-1" style="flex:1;"
          onclick="aplicarArredondamento(${s})">${fmtBRL(s).replace('R$ ','')}</button>
      `).join('');
    } else {
      chipsBox.innerHTML = '';
    }
  }

  // Determinar total final (com ou sem arredondamento)
  const inputAred = document.getElementById('input-arredondar');
  const valorAred = inputAred ? parseFloat(inputAred.value) : NaN;
  const totalFinal = (!isNaN(valorAred) && valorAred > 0) ? valorAred : subtotal;
  const bonificacao = totalFinal - subtotal;

  // Atualizar elementos do resumo
  document.getElementById('resumo-subtotal').textContent = fmtBRL(subtotal);
  document.getElementById('resumo-total').textContent = fmtBRL(totalFinal);
  document.getElementById('resumo-custo').textContent = fmtBRL(custo);
  const margemRS = totalFinal - custo;
  const margemPct = totalFinal > 0 ? (margemRS / totalFinal) * 100 : 0;
  document.getElementById('resumo-margemBRL').textContent = fmtBRL(margemRS);
  document.getElementById('resumo-margemPct').textContent = margemPct.toFixed(1) + '%';
  // Cor do card de margem
  const box = document.getElementById('resumo-margemPctBox');
  const txt = document.getElementById('resumo-margemPct');
  const lbl = box.querySelector('p');
  if (margemPct < 0) {
    box.style.background = '#FCEBEB'; txt.style.color = '#501313'; lbl.style.color = '#501313';
  } else if (margemPct < 20) {
    box.style.background = '#FAEEDA'; txt.style.color = '#412402'; lbl.style.color = '#412402';
  } else {
    box.style.background = '#E1F5EE'; txt.style.color = '#04342C'; lbl.style.color = '#04342C';
  }

  // Banner de bonificação
  const banner = document.getElementById('banner-bonificacao');
  if (banner) {
    if (Math.abs(bonificacao) > 0.005) {
      const positivo = bonificacao > 0;
      const cor = positivo
        ? 'background:#FAEEDA; border-left:3px solid #BA7517; color:#412402;'
        : 'background:#EEEDFE; border-left:3px solid #534AB7; color:#26215C;';
      const sinal = positivo ? '+' : '−';
      const texto = positivo
        ? `<strong>Bonificação:</strong> ${sinal}${fmtBRL(Math.abs(bonificacao))} (acréscimo do arredondamento) será registrada na DRE como <strong>bonificação recebida</strong>`
        : `<strong>Bonificação:</strong> ${sinal}${fmtBRL(Math.abs(bonificacao))} (desconto de arredondamento) será registrada na DRE como <strong>bonificação concedida</strong>`;
      banner.style.cssText = cor + 'padding:8px 12px; border-radius:0 6px 6px 0; font-size:12px;';
      banner.innerHTML = `<i data-lucide="gift" class="w-3 h-3 inline"></i> ${texto}`;
      banner.style.display = 'block';
      if (typeof lucide!=='undefined') lucide.createIcons();
    } else {
      banner.style.display = 'none';
    }
  }
}

function sugerirArredondamentos(subtotal) {
  // Sugere 3 valores: para baixo (múltiplo de 5 anterior), próximo, e para cima
  const sub = Math.max(subtotal, 1);
  let unidade = 5;
  if (sub >= 100) unidade = 10;
  if (sub >= 500) unidade = 50;
  if (sub >= 2000) unidade = 100;
  const baixo = Math.floor(sub / unidade) * unidade;
  const meio = Math.round(sub / unidade) * unidade;
  const alto = Math.ceil(sub / unidade) * unidade;
  // Dedup e adiciona próximos
  const set = new Set([baixo, meio, alto]);
  if (set.size < 3) {
    set.add(baixo + unidade);
    set.add(alto + unidade);
  }
  return [...set].sort((a,b) => a-b).slice(0, 3);
}

function aplicarArredondamento(valor) {
  document.getElementById('input-arredondar').value = valor.toFixed(2);
  atualizarResumoPedido();
}

function aplicarArredondamentoManual() {
  atualizarResumoPedido();
}

// ----- Submissão do pedido --------------------------------------------------
function handleNovoPedido(ev) {
  ev.preventDefault();
  const form = ev.target;
  const fd = new FormData(form);
  const itens = [];
  document.querySelectorAll('.pedido-item').forEach(row => {
    const idx = row.dataset.idx;
    const produtoId = row.querySelector(`[name="produtoId_${idx}"]`).value;
    const gramatura = parseFloat(row.querySelector(`[name="gramatura_${idx}"]`).value);
    const qtd = parseInt(row.querySelector(`[name="qtd_${idx}"]`).value);
    const preco = parseFloat(row.querySelector(`[name="preco_${idx}"]`).value);
    const modo = row.querySelector(`[name="modo_${idx}"]`).value;
    // Embalagem só existe quando modo === 'EMBALAGEM'
    const embalagemEl = row.querySelector(`[name="embalagemId_${idx}"]`);
    const embalagemId = embalagemEl ? embalagemEl.value : null;
    // Validação:
    //  - Item FRACIONADO precisa ter produto + gramatura
    //  - Item EMBALAGEM precisa ter embalagemId; produto e gramatura são opcionais
    const valido = (modo === 'EMBALAGEM')
      ? (embalagemId && qtd > 0 && preco > 0)
      : (produtoId && gramatura > 0 && qtd > 0 && preco > 0);
    if (valido) {
      itens.push({
        produtoId: produtoId || null,
        gramatura: gramatura || 0,
        qtd, preco, modo, embalagemId
      });
    }
  });
  if (itens.length === 0) { toast('Adicione pelo menos um item', 'erro'); return; }

  const tipo = fd.get('tipo');
  if (!tipo) { toast('Selecione o tipo do pedido (encomenda ou pronta entrega)', 'erro'); return; }

  // Calcular subtotal e total com arredondamento
  const subtotal = itens.reduce((s, i) => s + i.qtd * i.preco, 0);
  const inputAred = document.getElementById('input-arredondar');
  const valorAred = inputAred ? parseFloat(inputAred.value) : NaN;
  const totalFinal = (!isNaN(valorAred) && valorAred > 0) ? valorAred : subtotal;
  const bonificacao = totalFinal - subtotal;

  // Verificar saldo de PA
  const necessarioPorProduto = {};
  itens.forEach(it => {
    const prod = state.produtos.find(x => x.id === it.produtoId);
    if (!prod) return;
    const unidadesEq = (it.qtd * it.gramatura) / (prod.pesoLiq || 500);
    necessarioPorProduto[it.produtoId] = (necessarioPorProduto[it.produtoId] || 0) + unidadesEq;
  });
  const faltam = [];
  for (const [produtoId, necessario] of Object.entries(necessarioPorProduto)) {
    const prod = state.produtos.find(x => x.id === produtoId);
    if (prod && prod.saldoPa < necessario) {
      faltam.push({ produto: prod, pedido: necessario, saldo: prod.saldoPa, faltam: necessario - prod.saldoPa });
    }
  }

  // Verificar saldo de EMBALAGEM (modo embalagem)
  const necessarioPorEmbalagem = {};
  itens.forEach(it => {
    if (it.modo === 'EMBALAGEM' && it.embalagemId) {
      necessarioPorEmbalagem[it.embalagemId] = (necessarioPorEmbalagem[it.embalagemId] || 0) + it.qtd;
    }
  });
  const faltamEmb = [];
  for (const [embId, necessario] of Object.entries(necessarioPorEmbalagem)) {
    const emb = state.insumos.find(i => i.id === embId);
    if (emb && emb.saldo < necessario) {
      faltamEmb.push({ embalagem: emb, pedido: necessario, saldo: emb.saldo });
    }
  }
  if (faltamEmb.length > 0) {
    const lista = faltamEmb.map(f => `· ${f.embalagem.nome}: precisa ${f.pedido} ${f.embalagem.unidade}, tem ${f.saldo}`).join('\n');
    toast('Estoque de embalagem insuficiente:\n' + lista, 'erro');
    return;
  }

  if (tipo === 'PRONTA_ENTREGA' && faltam.length > 0) {
    const lista = faltam.map(f => `· ${f.produto.nome}: pedido equiv. ${fmtNum(f.pedido,2)} un, em estoque ${fmtNum(f.saldo,2)} un (faltam ${fmtNum(f.faltam,2)})`).join('\n');
    if (!confirm(`Estoque insuficiente para PRONTA ENTREGA:\n\n${lista}\n\nDeseja converter este pedido para ENCOMENDA e gerar Ordem(ns) de Produção automaticamente?\n\nClique OK para converter em encomenda + gerar OP, ou Cancelar para revisar os itens.`)) {
      return;
    }
    criarPedidoComOP(form, fd, itens, 'ENCOMENDA', faltam, true, totalFinal, bonificacao);
    return;
  }

  if (tipo === 'ENCOMENDA' && faltam.length > 0) {
    const lista = faltam.map(f => `· ${f.produto.nome}: pedido equiv. ${fmtNum(f.pedido,2)} un, em estoque ${fmtNum(f.saldo,2)} un (faltam ${fmtNum(f.faltam,2)})`).join('\n');
    if (!confirm(`Encomenda sem estoque suficiente:\n\n${lista}\n\nCriar ordem(ns) de produção automaticamente para atender este pedido?\n\nOK = cria OP(s) programada(s) · Cancelar = cria só o rascunho do pedido sem OP.`)) {
      criarPedidoComOP(form, fd, itens, tipo, [], false, totalFinal, bonificacao);
      return;
    }
    criarPedidoComOP(form, fd, itens, tipo, faltam, true, totalFinal, bonificacao);
    return;
  }

  criarPedidoComOP(form, fd, itens, tipo, [], false, totalFinal, bonificacao);
}

function criarPedidoComOP(form, fd, itens, tipo, faltam, criarOPs, totalFinal, bonificacao) {
  const subtotal = itens.reduce((s, i) => s + i.qtd * i.preco, 0);
  // Custo snapshot — proporcional à gramatura + custo de embalagem (se item EMBALAGEM)
  let custoSnapshot = 0;
  for (const i of itens) {
    const prod = state.produtos.find(x => x.id === i.produtoId);
    const r = state.receitas.find(rec => rec.produtoId === i.produtoId && rec.ativa);
    if (r && prod) {
      const c = calcularCustoReceita(r.id);
      const fatorGramatura = i.gramatura / (prod.pesoLiq || 500);
      custoSnapshot += c.custoTotal * fatorGramatura * i.qtd;
    }
    // Soma custo da embalagem se for item de modo EMBALAGEM
    if (i.modo === 'EMBALAGEM' && i.embalagemId) {
      const emb = state.insumos.find(ins => ins.id === i.embalagemId);
      if (emb) custoSnapshot += (Number(emb.cmp) || 0) * i.qtd;
    }
  }

  const proxNum = Math.max(...state.pedidos.map(p => p.numero), 0) + 1;
  // Forma e prazo de pagamento — usa do form, ou fallback do cliente
  const cli = state.clientes.find(c => c.id === fd.get('clienteId'));
  const formaPagto = fd.get('formaPagto') || cli?.formaPagto || '';
  const prazoDiasInput = fd.get('prazoDias');
  const prazoDias = (prazoDiasInput !== '' && prazoDiasInput != null)
    ? parseInt(prazoDiasInput)
    : (cli?.prazoDias || 0);
  const novoPedido = {
    id: 'pe'+uid(), numero: proxNum, tipo,
    clienteId: fd.get('clienteId'), canal: fd.get('canal'),
    formaPagto, prazoDias,
    statusComercial: 'RASCUNHO', statusProdutivo: 'AGUARDANDO',
    criadoEm: new Date().toISOString(), dataEntrega: fd.get('dataEntrega'),
    subtotal,
    total: totalFinal,
    bonificacao: bonificacao || 0,
    custoSnapshot,
    itens
  };
  state.pedidos.unshift(novoPedido);
  const detBon = Math.abs(bonificacao) > 0.005 ? ` · bonificação ${bonificacao > 0 ? '+' : '−'}${fmtBRL(Math.abs(bonificacao))}` : '';
  logAuditoria('06_pedido', 'RASCUNHO_CRIADO', novoPedido.id,
    `Pedido #${proxNum} · ${tipo === 'ENCOMENDA' ? 'Encomenda' : 'Pronta entrega'} · ${fmtBRL(totalFinal)}${detBon}`);

  // Gerar OPs automáticas
  const opsCriadas = [];
  if (criarOPs && faltam.length > 0) {
    faltam.forEach(f => {
      const proxNumOP = Math.max(...state.ordens.map(o => o.numero), 0) + 1 + opsCriadas.length;
      const loteUn = Math.max(1, Math.ceil(f.faltam));
      const novaOP = {
        id: 'op'+uid(), numero: proxNumOP, produtoId: f.produto.id,
        tamanhoLote: loteUn, status: 'PROGRAMADA',
        programadaPara: fd.get('dataEntrega'),
        iniciadaEm: null, concluidaEm: null,
        custoTotal: null, custoUnitario: null,
        pedidoOrigemId: novoPedido.id,
        fases: [
          { nome:'Pesagem', concluida:false }, { nome:'Mistura', concluida:false },
          { nome:'Modelagem', concluida:false }, { nome:'Forneamento', concluida:false },
          { nome:'Embalagem', concluida:false }
        ]
      };
      state.ordens.push(novaOP);
      opsCriadas.push(novaOP);
      logAuditoria('10_ordem_producao', 'PROGRAMADA_VIA_PEDIDO', novaOP.id,
        `OP-${proxNumOP} programada automaticamente · ${loteUn} un de ${f.produto.nome} para Pedido #${novoPedido.numero}`);
    });
  }

  persistState();
  fecharModal();
  if (opsCriadas.length > 0) {
    toast(`Pedido #${proxNum} criado · ${opsCriadas.length} OP(s) gerada(s) automaticamente`);
  } else {
    toast(`Pedido #${proxNum} (${tipo === 'ENCOMENDA' ? 'encomenda' : 'pronta entrega'}) criado como rascunho`);
  }
  render();
}

// ----- Pré-preenche forma/prazo de pagto do cliente ao trocar no select ----
function aplicarPagamentoDoCliente(clienteId) {
  const cli = state.clientes.find(c => c.id === clienteId);
  if (!cli) return;

}

// ----- Cancelar pedido (com estorno de estoque, embalagem e contas) --------
async function cancelarPedido(pedidoId) {
  const p = state.pedidos.find(x => x.id === pedidoId);
  if (!p) return;
  if (p.statusComercial === 'CANCELADO') {
    toast('Pedido já está cancelado', 'erro');
    return;
  }
  const motivo = prompt(`Cancelar pedido #${p.numero}?\n\nIsso vai:\n- Marcar pedido como CANCELADO\n- Estornar saldo de produtos (se já foi baixado)\n- Estornar saldo de embalagens\n- Cancelar conta a receber vinculada\n- Cancelar OPs vinculadas (se não iniciadas)\n\nMotivo do cancelamento:`);
  if (motivo === null) return; // cancelou o prompt
  // Estorno de PA + embalagem (só se já foi confirmado)
  if (p.statusComercial !== 'RASCUNHO') {
    const necessario = {};
    const necessarioEmb = {};
    p.itens.forEach(it => {
      const prod = state.produtos.find(x => x.id === it.produtoId);
      if (prod) {
        const gramatura = it.gramatura || prod.pesoLiq;
        const unEq = (it.qtd * gramatura) / (prod.pesoLiq || 500);
        necessario[it.produtoId] = (necessario[it.produtoId] || 0) + unEq;
      }
      if (it.modo === 'EMBALAGEM' && it.embalagemId) {
        necessarioEmb[it.embalagemId] = (necessarioEmb[it.embalagemId] || 0) + it.qtd;
      }
    });
    for (const [produtoId, qtd] of Object.entries(necessario)) {
      const prod = state.produtos.find(x => x.id === produtoId);
      if (prod) prod.saldoPa = (Number(prod.saldoPa) || 0) + qtd;
    }
    for (const [embId, qtd] of Object.entries(necessarioEmb)) {
      const emb = state.insumos.find(i => i.id === embId);
      if (emb) emb.saldo = (Number(emb.saldo) || 0) + qtd;
    }
  }
  // Cancelar conta a receber
  state.contasReceber.forEach(c => {
    if (c.pedidoId === pedidoId && c.status === 'ABERTA') c.status = 'CANCELADA';
  });
  // Cancelar OPs programadas/em andamento ainda não concluídas
  state.ordens.forEach(o => {
    if (o.pedidoOrigemId === pedidoId && o.status !== 'CONCLUIDA') {
      o.status = 'CANCELADA';
    }
  });
  // Marcar pedido
  p.statusComercial = 'CANCELADO';
  p.statusProdutivo = 'CANCELADO';
  p.canceladoEm = new Date().toISOString();
  p.motivoCancelamento = motivo;
  logAuditoria('06_pedido', 'CANCELADO', p.id, `Pedido #${p.numero} cancelado · motivo: ${motivo}`);
  persistState();
  toast(`Pedido #${p.numero} cancelado · estoque estornado`);
  fecharModal();
  render();
}

function renderItemEdicaoRow(i, idx) {

        <input type="number" min="1" step="1" value="${i.gramatura}"
          data-original-gramatura="${i.gramatura}"
          data-produto-id="${i.produtoId}"
          class="input text-xs num text-right" style="width:80px;"
          oninput="recalcularPrecoItemEdicao(${idx})">
      </td>
      <td class="text-right">
        <input type="number" min="0" step="1" value="${i.qtd}"
          class="input text-xs num text-right" style="width:60px;"

      </td>
