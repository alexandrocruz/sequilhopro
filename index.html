// Recalcula preço sugerido baseado em R$/g da ficha técnica × nova gramatura
// (só se usuário não tiver editado manualmente o preço)
function recalcularPrecoItemEdicao(idx) {
  const row = document.querySelector(`tr.item-edicao[data-idx="${idx}"]`);
  if (!row) return;
  const inputGramatura = row.querySelector('input[data-original-gramatura]');
  const inputPreco = row.querySelector('input[data-foi-editado]');
  const produtoId = inputGramatura.dataset.produtoId;
  const novaGramatura = parseFloat(inputGramatura.value) || 0;

  if (inputPreco.dataset.foiEditado !== '1' && novaGramatura > 0) {
    // Calcular preço sugerido = preçoEmbalagemCompleta / pesoLiq * gramatura, arredondado a R$ 0,10
    const prod = state.produtos.find(x => x.id === produtoId);
    const rec = state.receitas.find(rc => rc.produtoId === produtoId && rc.ativa);
    if (prod && rec) {
      const custo = calcularCustoReceita(rec.id);
      const precoCompleto = custo ? calcularPrecoSugerido(custo.custoTotal) : 0;
      const precoG = (precoCompleto / (prod.pesoLiq || 500)) * novaGramatura;
      inputPreco.value = (Math.round(precoG * 10) / 10).toFixed(2);
    }
  }
  recalcularSubtotalItemEdicao(idx);
}

// Recalcula só o subtotal de uma linha
function recalcularSubtotalItemEdicao(idx) {
  const row = document.querySelector(`tr.item-edicao[data-idx="${idx}"]`);
  if (!row) return;
  const inputs = row.querySelectorAll('input');
  const gramatura = parseFloat(inputs[0].value) || 0;
  const qtd = parseFloat(inputs[1].value) || 0;
  const preco = parseFloat(inputs[2].value) || 0;
  const sub = qtd * preco;
  const cell = document.getElementById(`subtotal-edicao-${idx}`);
  if (cell) cell.textContent = fmtBRL(sub);
  recalcularTotalEdicao();
}

// Recalcula total geral + valida saldos disponíveis
function recalcularTotalEdicao() {
  let total = 0;
  const snapshot = window._editPedSnapshot;
  if (!snapshot) return;
  // Diferenças por produto (em unidades equivalentes) e por embalagem
  const difPA = {}; // produtoId → diferença (positiva = baixar mais, negativa = estornar)
  const difEmb = {};
  document.querySelectorAll('tr.item-edicao').forEach(row => {
    const idx = parseInt(row.dataset.idx);
    const inputs = row.querySelectorAll('input');
    const gramatura = parseFloat(inputs[0].value) || 0;
    const qtd = parseFloat(inputs[1].value) || 0;
    const preco = parseFloat(inputs[2].value) || 0;
    total += qtd * preco;
    const original = snapshot.itensOriginais[idx];
    if (!original) return;
    const prod = state.produtos.find(x => x.id === original.produtoId);
    if (!prod) return;
    // Diferença de unidades equivalentes (gramatura × qtd) / pesoLiq
    const unEqOriginal = (original.gramatura * original.qtd) / (prod.pesoLiq || 500);
    const unEqNovo = (gramatura * qtd) / (prod.pesoLiq || 500);
    const diff = unEqNovo - unEqOriginal;
    if (diff !== 0) difPA[prod.id] = (difPA[prod.id] || 0) + diff;
    // Diferença de embalagem (modo EMBALAGEM)
    if (original.modo === 'EMBALAGEM' && original.embalagemId) {
      const diffEmb = qtd - original.qtd;
      if (diffEmb !== 0) difEmb[original.embalagemId] = (difEmb[original.embalagemId] || 0) + diffEmb;
    }
  });

  // Atualizar total na tabela
  const totalCell = document.getElementById('total-pedido-edicao');
  if (totalCell) totalCell.textContent = fmtBRL(total);

  // Validar saldos (avisar se estoque insuficiente para aumento)
  const avisosBox = document.getElementById('avisos-edicao');
  if (!avisosBox) return;
  const alertas = [];
  // Só validamos se status original já consumiu estoque (CONFIRMADO em diante)
  if (snapshot.statusOriginal !== 'RASCUNHO') {
    for (const [produtoId, diff] of Object.entries(difPA)) {
      if (diff > 0) { // está pedindo MAIS do que antes
        const prod = state.produtos.find(x => x.id === produtoId);
        if (prod && prod.saldoPa < diff) {
          alertas.push(`⚠ ${prod.nome}: precisa baixar mais ${fmtNum(diff,2)} un, mas tem só ${fmtNum(prod.saldoPa,2)} em estoque`);
        }
      }
    }
    for (const [embId, diffE] of Object.entries(difEmb)) {
      if (diffE > 0) {
        const emb = state.insumos.find(i => i.id === embId);
        if (emb && emb.saldo < diffE) {
          alertas.push(`⚠ ${emb.nome}: precisa baixar mais ${diffE} ${emb.unidade}, mas tem só ${emb.saldo}`);
        }
      }
    }
  }
  avisosBox.innerHTML = alertas.length === 0
    ? `<p class="text-[11px] text-brand-teal-900">✓ Saldos disponíveis suficientes para as alterações.</p>`
    : alertas.map(a => `<p class="text-[11px]" style="color:#501313; background:#FCEBEB; padding:4px 8px; border-radius:4px;">${a}</p>`).join('');
}

function handleEditarPedido(ev, pedidoId) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const p = state.pedidos.find(x => x.id === pedidoId);
  if (!p) return;
  const snapshot = window._editPedSnapshot;
  if (!snapshot || snapshot.id !== pedidoId) {
    toast('Estado de edição perdido — feche e tente novamente', 'erro');
    return;
  }

  // Coletar novos valores dos itens
  const novosItens = [];
  const linhas = document.querySelectorAll('tr.item-edicao');
  linhas.forEach(row => {
    const idx = parseInt(row.dataset.idx);
    const original = snapshot.itensOriginais[idx];
    if (!original) return;
    const inputs = row.querySelectorAll('input');
    const gramatura = parseFloat(inputs[0].value) || 0;
    const qtd = parseFloat(inputs[1].value) || 0;
    const preco = parseFloat(inputs[2].value) || 0;
    if (gramatura <= 0 || qtd <= 0 || preco < 0) return;
    novosItens.push({
      ...original, // preserva modo, embalagemId, produtoId
      gramatura, qtd, preco
    });
  });
  if (novosItens.length === 0) {
    toast('O pedido precisa ter pelo menos um item', 'erro');
    return;
  }

  // Calcular diferenças de estoque para aplicar (PA + embalagem)
  const difPA = {};
  const difEmb = {};
  snapshot.itensOriginais.forEach((orig, idx) => {
    const novo = novosItens[idx];
    if (!novo) return;
    const prod = state.produtos.find(x => x.id === orig.produtoId);
    if (!prod) return;
    const unEqOrig = (orig.gramatura * orig.qtd) / (prod.pesoLiq || 500);
    const unEqNovo = (novo.gramatura * novo.qtd) / (prod.pesoLiq || 500);
    const diff = unEqNovo - unEqOrig;
    if (diff !== 0) difPA[prod.id] = (difPA[prod.id] || 0) + diff;
    if (orig.modo === 'EMBALAGEM' && orig.embalagemId) {
      const diffE = novo.qtd - orig.qtd;
      if (diffE !== 0) difEmb[orig.embalagemId] = (difEmb[orig.embalagemId] || 0) + diffE;
    }
  });

  // Aplicar diferenças NO ESTOQUE — só se pedido já estava CONFIRMADO (estoque foi consumido)
  if (snapshot.statusOriginal !== 'RASCUNHO') {
    // Validar saldos primeiro
    for (const [produtoId, diff] of Object.entries(difPA)) {
      if (diff > 0) {
        const prod = state.produtos.find(x => x.id === produtoId);
        if (prod && prod.saldoPa < diff) {
          toast(`Saldo insuficiente para ${prod.nome} (precisa de mais ${fmtNum(diff,2)} un, tem ${fmtNum(prod.saldoPa,2)})`, 'erro');
          return;
        }
      }
    }
    for (const [embId, diffE] of Object.entries(difEmb)) {
      if (diffE > 0) {
        const emb = state.insumos.find(i => i.id === embId);
        if (emb && emb.saldo < diffE) {
          toast(`Saldo de embalagem insuficiente: ${emb.nome}`, 'erro');
          return;
        }
      }
    }
    // Aplicar
    for (const [produtoId, diff] of Object.entries(difPA)) {
      const prod = state.produtos.find(x => x.id === produtoId);
      if (prod) prod.saldoPa = Math.max(0, (Number(prod.saldoPa) || 0) - diff);
    }
    for (const [embId, diffE] of Object.entries(difEmb)) {
      const emb = state.insumos.find(i => i.id === embId);
      if (emb) emb.saldo = Math.max(0, (Number(emb.saldo) || 0) - diffE);
    }
  }

  // Atualizar pedido
  p.itens = novosItens;
  p.subtotal = novosItens.reduce((s, i) => s + (i.qtd * i.preco), 0);
  // Preserva bonificação proporcional se total era arredondado? Por simplicidade, zera.
  // Custo snapshot recalculado
  let custoSnapshot = 0;
  for (const it of novosItens) {
    const prod = state.produtos.find(x => x.id === it.produtoId);
    const r = state.receitas.find(rec => rec.produtoId === it.produtoId && rec.ativa);
    if (r && prod) {
      const c = calcularCustoReceita(r.id);
      const fator = it.gramatura / (prod.pesoLiq || 500);
      custoSnapshot += c.custoTotal * fator * it.qtd;
    }
    if (it.modo === 'EMBALAGEM' && it.embalagemId) {
      const emb = state.insumos.find(ins => ins.id === it.embalagemId);
      if (emb) custoSnapshot += (Number(emb.cmp) || 0) * it.qtd;
    }
  }
  p.custoSnapshot = custoSnapshot;
  // Total = subtotal (sem novo arredondamento) + bonificação anterior se houver
  p.total = p.subtotal + (Number(p.bonificacao) || 0);

  // Atualizar campos extra do form
  p.dataEntrega = fd.get('dataEntrega') || p.dataEntrega;
  p.canal = fd.get('canal') || p.canal;
  p.formaPagto = fd.get('formaPagto') || '';
  p.prazoDias = parseInt(fd.get('prazoDias')) || 0;

  // Atualizar conta a receber
  state.contasReceber.forEach(c => {
    if (c.pedidoId === pedidoId && c.status === 'ABERTA') {
      const dataCriacao = (p.criadoEm || '').slice(0, 10) || todayISO();
      c.vencimento = addDaysISO(dataCriacao, p.prazoDias);
      c.valor = p.total;
    }
  });

  logAuditoria('06_pedido', 'EDITADO', p.id, `Pedido #${p.numero} editado · novo total ${fmtBRL(p.total)} · ${novosItens.length} item(ns)`);
  delete window._editPedSnapshot;
  persistState();
  fecharModal();
  toast(`Pedido #${p.numero} atualizado · total ${fmtBRL(p.total)}`);
  render();
}

function renderAgenda() {
  const hoje = todayISO();
  const tomorrow = new Date(Date.now()+86400000).toISOString().slice(0,10);
  const semana = new Date(Date.now()+7*86400000).toISOString().slice(0,10);

  const atrasados = state.pedidos.filter(p => p.dataEntrega < hoje && p.statusComercial === 'CONFIRMADO' && p.statusProdutivo !== 'ENTREGUE');
  const deHoje = state.pedidos.filter(p => p.dataEntrega === hoje && p.statusComercial === 'CONFIRMADO');
  const deAmanha = state.pedidos.filter(p => p.dataEntrega === tomorrow && p.statusComercial === 'CONFIRMADO');
  const desta = state.pedidos.filter(p => p.dataEntrega > tomorrow && p.dataEntrega <= semana && p.statusComercial === 'CONFIRMADO');

  return `
    ${pageHeader('09', 'AGENDA', 'Entregas previstas')}

    ${atrasados.length > 0 ? `
      <div class="danger-banner mb-4">
        <p class="font-medium text-sm">⚠ ${atrasados.length} pedido(s) atrasado(s)</p>
      </div>` : ''}

    <div class="grid grid-cols-2 gap-4">
      ${renderColunaAgenda('Atrasados', atrasados, 'coral')}
      ${renderColunaAgenda('Hoje · ' + new Date().toLocaleDateString('pt-BR', {day:'numeric',month:'short'}), deHoje, 'teal')}
      ${renderColunaAgenda('Amanhã', deAmanha, 'purple')}
      ${renderColunaAgenda('Esta semana', desta, 'amber')}
    </div>

    <div class="card mt-5">
      <h3 class="font-display text-lg mb-2">Capacidade do forno · próximos 7 dias</h3>
      <p class="text-xs text-stone-500 mb-3">Cada barra representa 1 dia · capacidade máxima 4 OPs de 100un</p>
      <div class="grid grid-cols-7 gap-2">
        ${[0,1,2,3,4,5,6].map(d => {
          const dt = new Date(Date.now() + d*86400000);
          const data = dt.toISOString().slice(0,10);
          const ops = state.ordens.filter(o => o.programadaPara === data).length;
          const cor = ops >= 4 ? 'bg-brand-coral-600' : ops >= 3 ? 'bg-brand-amber-600' : 'bg-brand-teal-600';
          return `
            <div class="text-center">
              <p class="text-xs text-stone-500">${dt.toLocaleDateString('pt-BR', {weekday:'short'})}</p>
              <p class="text-xs font-medium">${dt.getDate()}/${dt.getMonth()+1}</p>
              <div class="h-24 bg-stone-100 rounded mt-1 relative overflow-hidden">
                <div class="absolute bottom-0 left-0 right-0 ${cor}" style="height:${(ops/4)*100}%"></div>
                <p class="absolute inset-0 flex items-center justify-center text-xs font-semibold text-stone-900">${ops}</p>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function handleEditarOP(ev, opId) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const o = state.ordens.find(x => x.id === opId);
  o.produtoId = fd.get('produtoId');
  o.tamanhoLote = parseInt(fd.get('tamanhoLote'));
  o.programadaPara = fd.get('programadaPara');
  logAuditoria('10_ordem_producao', 'EDITADA', opId, `OP-${o.numero} editada`);
  persistState();
  fecharModal();
  toast(`OP-${o.numero} atualizada`);
  render();
}

function iniciarOP(opId) {
  const o = state.ordens.find(x => x.id === opId);
  if (!o) return;
  // Valida saldo de insumos
  const r = state.receitas.find(rec => rec.produtoId === o.produtoId && rec.ativa);
  if (!r) {
    if (!confirm('Esta OP não tem ficha técnica ativa. Iniciar mesmo assim (sem baixa de insumos)?')) return;
  } else {
    const bateladas = o.tamanhoLote / r.rendimentoUn;
    const faltam = [];
    for (const it of r.itens) {
      const ins = state.insumos.find(x => x.id === it.insumoId);
      const necessario = it.qtd * bateladas;
      if (ins.saldo < necessario) {
        faltam.push(`${ins.nome}: precisa ${fmtNum(necessario)}${ins.unidade}, tem ${fmtNum(ins.saldo)}${ins.unidade}`);
      }
    }
    if (faltam.length > 0) {
      if (!confirm(`Saldo insuficiente para esta OP:\n\n${faltam.join('\n')}\n\nIniciar mesmo assim?`)) return;
    } else {
      // Baixa insumos
      for (const it of r.itens) {
        const necessario = it.qtd * bateladas;
        lancarSaidaInsumo(it.insumoId, necessario, 'SAIDA_PRODUCAO', `OP-${o.numero}`);
      }
    }
  }
  o.status = 'EM_ANDAMENTO';
  o.iniciadaEm = new Date().toISOString();
  logAuditoria('10_ordem_producao', 'INICIADA', opId, `OP-${o.numero} iniciada`);
  persistState();
  toast(`OP-${o.numero} iniciada · insumos baixados`);
  render();
}

function toggleFaseOP(opId, faseIdx) {
  const o = state.ordens.find(x => x.id === opId);
  if (!o || o.status !== 'EM_ANDAMENTO') return;
  const fase = o.fases[faseIdx];
  const agora = new Date().toISOString();
  const operador = state.usuarioAtual?.nome || state.usuarioAtual?.email || 'operador';

  if (!fase.concluida) {
    // Marcando como concluída agora
    // Define `fim` desta fase como agora
    fase.fim = agora;
    fase.operador = operador;
    // Início desta fase = max(início da OP, fim da fase anterior, ou agora se nenhum)
    if (!fase.inicio) {
      const faseAnt = o.fases[faseIdx - 1];
      fase.inicio = (faseAnt && faseAnt.fim) ? faseAnt.fim : (o.iniciadaEm || agora);
    }
    // Calcula duração em minutos
    const inicioMs = new Date(fase.inicio).getTime();
    const fimMs = new Date(fase.fim).getTime();
    fase.duracaoMin = Math.max(0, Math.round((fimMs - inicioMs) / 60000));
    fase.concluida = true;
  } else {
    // Desmarcando: limpa fim e duração, mas preserva inicio (pode reconcluir depois)
    fase.fim = null;
    fase.duracaoMin = null;
    fase.concluida = false;
  }
  persistState();
  render();
}

function retomarOP(opId) {
  const o = state.ordens.find(x => x.id === opId);
  if (!o) return;
  o.status = 'EM_ANDAMENTO';
  logAuditoria('10_ordem_producao', 'RETOMADA', opId, `OP-${o.numero} retomada`);

}

function concluirOP(opId) {
  const o = state.ordens.find(x => x.id === opId);
  if (!o) return;
  if (!o.fases.every(f => f.concluida)) {
    toast('Marque todas as fases como concluídas antes de finalizar a OP', 'erro');
    return;
  }
  // Calcula custo total baseado na ficha técnica ativa
  const r = state.receitas.find(rec => rec.produtoId === o.produtoId && rec.ativa);
  if (r) {
    const c = calcularCustoReceita(r.id);
    o.custoUnitario = c.custoTotal;
    o.custoTotal = c.custoTotal * o.tamanhoLote;
  } else {
    o.custoUnitario = 0;
    o.custoTotal = 0;
  }
  o.status = 'CONCLUIDA';
  o.concluidaEm = new Date().toISOString();
  // Entrada em produto acabado
  const prod = state.produtos.find(p => p.id === o.produtoId);
  if (prod) prod.saldoPa += o.tamanhoLote;
  logAuditoria('10_ordem_producao', 'CONCLUIDA', opId,
    `OP-${o.numero} concluída · ${o.tamanhoLote}un · custo ${fmtBRL(o.custoTotal)} (${fmtBRL(o.custoUnitario)}/un) · PA +${o.tamanhoLote}`);
  persistState();
  toast(`OP-${o.numero} concluída · ${o.tamanhoLote} un em estoque · ${fmtBRL(o.custoUnitario)}/un`);
  render();
}

// Calcula o MOD (mão de obra direta) apropriado em um pedido,
// usando a receita ativa atual de cada produto, proporcional à gramatura vendida.
function calcularMODPedido(pedido) {
  let modTotal = 0;
  if (!pedido || !Array.isArray(pedido.itens)) return 0;
  pedido.itens.forEach(it => {
    const prod = state.produtos.find(x => x.id === it.produtoId);
    const r = state.receitas.find(rec => rec.produtoId === it.produtoId && rec.ativa);
    if (!prod || !r) return;
    // MOD por unidade completa (1 batelada → r.rendimentoUn unidades)
    const modPorEmbCompleta = (r.tempoH * r.taxaMod) / Math.max(r.rendimentoUn, 1);
    const gramatura = it.gramatura || prod.pesoLiq || 500;
    const fatorGramatura = gramatura / (prod.pesoLiq || 500);
    modTotal += modPorEmbCompleta * fatorGramatura * it.qtd;
  });
  return modTotal;
}

function calcularDRE(anoAlvo) {
  // Para cada mês do ano, calcular:
  //   Receita bruta dos itens = subtotal dos pedidos (sem arredondamento)
  //   Bonificações (±) = total cobrado − subtotal (delta do arredondamento)
  //   Receita líquida = Receita bruta + Bonificações
  //   MOD apropriado = mão de obra direta dos mesmos pedidos (→ vai para FOLHA, não CPV)
  //   CPV (insumos + depreciação) = custoSnapshot − MOD
  //   Lucro Bruto = Receita líquida − CPV
  const meses = Array.from({length:12}, (_, i) => ({
    mes: i+1, nome: ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][i],
    receitaItens: 0, bonificacao: 0, cpv: 0, modApropriado: 0,
    despesasOp: 0, folhaContas: 0, despesasUtilidades: 0
  }));

  state.pedidos.forEach(p => {
    if (p.statusComercial === 'CANCELADO' || p.statusComercial === 'RASCUNHO') return;
    const dt = new Date(p.criadoEm);
    if (dt.getFullYear() !== anoAlvo) return;
    const m = meses[dt.getMonth()];
    const totalFinal = Number(p.total) || 0;
    const subtotalItens = (typeof p.subtotal === 'number') ? p.subtotal : totalFinal;
    const bon = (typeof p.bonificacao === 'number') ? p.bonificacao : (totalFinal - subtotalItens);
    const snapshotTotal = Number(p.custoSnapshot) || 0;
    const mod = calcularMODPedido(p);
    m.receitaItens += subtotalItens;
    m.bonificacao += bon;
    m.modApropriado += mod;
    m.cpv += Math.max(0, snapshotTotal - mod);
  });

  state.contasPagar.forEach(c => {
    if (c.status !== 'PAGA' || !c.pagoEm) return;
    const dt = new Date(c.pagoEm);
    if (dt.getFullYear() !== anoAlvo) return;
    const m = meses[dt.getMonth()];
    const cat = c.categoria || 'operacional';
    if (cat === 'folha') m.folhaContas += Number(c.valor) || 0;
    else if (cat === 'utilidades') m.despesasUtilidades += Number(c.valor) || 0;
    else m.despesasOp += Number(c.valor) || 0;
  });

  meses.forEach(m => {
    m.receita = m.receitaItens + m.bonificacao;     // receita líquida (após arredondamento)
    m.lucroBruto = m.receita - m.cpv;
    m.folhaTotal = m.folhaContas + m.modApropriado;
    m.totalDespesas = m.despesasOp + m.folhaTotal + m.despesasUtilidades;
    m.lucroLiquido = m.lucroBruto - m.totalDespesas;
    m.margemBruta = m.receita > 0 ? (m.lucroBruto / m.receita) * 100 : 0;
    m.margemLiquida = m.receita > 0 ? (m.lucroLiquido / m.receita) * 100 : 0;
  });

  const total = meses.reduce((acc, m) => ({
    receitaItens: acc.receitaItens + m.receitaItens,
    bonificacao: acc.bonificacao + m.bonificacao,
    cpv: acc.cpv + m.cpv,
    modApropriado: acc.modApropriado + m.modApropriado,
    despesasOp: acc.despesasOp + m.despesasOp,
    folhaContas: acc.folhaContas + m.folhaContas,
    despesasUtilidades: acc.despesasUtilidades + m.despesasUtilidades,
  }), { receitaItens:0, bonificacao:0, cpv:0, modApropriado:0, despesasOp:0, folhaContas:0, despesasUtilidades:0 });
  total.receita = total.receitaItens + total.bonificacao;
  total.lucroBruto = total.receita - total.cpv;
  total.folhaTotal = total.folhaContas + total.modApropriado;
  total.totalDespesas = total.despesasOp + total.folhaTotal + total.despesasUtilidades;
  total.lucroLiquido = total.lucroBruto - total.totalDespesas;
  total.margemBruta = total.receita > 0 ? (total.lucroBruto / total.receita) * 100 : 0;
  total.margemLiquida = total.receita > 0 ? (total.lucroLiquido / total.receita) * 100 : 0;

  return { meses, total };
}

function renderDRE() {
  const anoAtual = new Date().getFullYear();
  const anoAlvo = window._dreAno || anoAtual;
  const { meses, total } = calcularDRE(anoAlvo);

  const anos = [...anosDisponiveis].sort((a,b) => b-a);

  // Limite das barras (para escala visual)
  const maxValor = Math.max(...meses.map(m => Math.max(m.receita, m.lucroLiquido, -m.lucroLiquido)), 1);

  return `
    <div class="flex items-center justify-between mb-4">

// ----- FLUXO DE CAIXA --------------------------------------------------------
// Mostra entradas e saídas reais de dinheiro (regime de caixa):
//  - Entradas: contas a receber pagas no mês
//  - Saídas: contas a pagar pagas no mês + entradas de NF-e de insumos (compras)
function calcularFluxoCaixa(anoAlvo) {
  const meses = Array.from({length:12}, (_, i) => ({
    mes: i+1, nome: ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][i],
    entradasReceber: 0, saidasPagar: 0, comprasInsumos: 0
  }));
  // Entradas: contas a receber PAGAS
  state.contasReceber.forEach(c => {
    if (c.status !== 'PAGA' || !c.pagoEm) return;
    const dt = new Date(c.pagoEm);
    if (dt.getFullYear() !== anoAlvo) return;
    meses[dt.getMonth()].entradasReceber += Number(c.valor) || 0;
  });
  // Saídas: contas a pagar PAGAS
  state.contasPagar.forEach(c => {
    if (c.status !== 'PAGA' || !c.pagoEm) return;
    const dt = new Date(c.pagoEm);
    if (dt.getFullYear() !== anoAlvo) return;
    meses[dt.getMonth()].saidasPagar += Number(c.valor) || 0;
  });
  // Compras de insumos (lançamentos do tipo ENTRADA em movimentos)
  state.movimentos.forEach(m => {
    if (m.tipo !== 'ENTRADA' || !m.data) return;
    const dt = new Date(m.data);
    if (dt.getFullYear() !== anoAlvo) return;
    const valorEntrada = (Number(m.qtd) || 0) * (Number(m.custoUnit) || 0);
    meses[dt.getMonth()].comprasInsumos += valorEntrada;
  });
  meses.forEach(m => {
    m.totalEntradas = m.entradasReceber;
    m.totalSaidas = m.saidasPagar + m.comprasInsumos;
    m.saldo = m.totalEntradas - m.totalSaidas;
  });
  // Saldo acumulado
  let acc = 0;
  meses.forEach(m => { acc += m.saldo; m.saldoAcumulado = acc; });
  const total = meses.reduce((acc, m) => ({
    entradasReceber: acc.entradasReceber + m.entradasReceber,
    saidasPagar: acc.saidasPagar + m.saidasPagar,
    comprasInsumos: acc.comprasInsumos + m.comprasInsumos,
    totalEntradas: acc.totalEntradas + m.totalEntradas,
    totalSaidas: acc.totalSaidas + m.totalSaidas,
    saldo: acc.saldo + m.saldo,
  }), { entradasReceber:0, saidasPagar:0, comprasInsumos:0, totalEntradas:0, totalSaidas:0, saldo:0 });
  total.saldoAcumulado = total.saldo;
  return { meses, total };
}

  const anoAtual = new Date().getFullYear();
  const anoAlvo = window._caixaAno || anoAtual;
  const { meses, total } = calcularFluxoCaixa(anoAlvo);

function linhaDRE(rotulo, valoresMensais, valorTotal, classes = '', projetado = null) {
  return `
    <tr class="${classes}">
      <td class="text-xs sticky left-0 z-10 ${classes.includes('bg-') ? '' : 'bg-white'}">${rotulo}</td>
      ${valoresMensais.map(v => `<td class="text-right text-[11px] num">${v !== 0 ? fmtBRL(v) : '—'}</td>`).join('')}
      <td class="text-right num text-xs font-medium">${fmtBRL(valorTotal)}</td>
      <td class="text-right num text-[11px] ${projetado != null ? 'text-stone-500' : 'text-stone-300'}">${projetado != null ? fmtBRL(projetado) : '—'}</td>
    </tr>
  `;
}

function marcarPaga(tipo, id) {
  const lista = tipo === 'cr' ? state.contasReceber : state.contasPagar;
  const c = lista.find(x => x.id === id);
  c.status = 'PAGA';
  c.pagoEm = todayISO();
  logAuditoria('11_financeiro', tipo === 'cr' ? 'RECEBIMENTO' : 'PAGAMENTO', id, `${c.descricao} · ${fmtBRL(c.valor)}`);
  persistState();
  toast(`${tipo === 'cr' ? 'Recebimento' : 'Pagamento'} registrado`);
  render();
}

      <div class="col-span-2 card">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-display text-lg">Log de auditoria</h3>
          <select class="input text-xs" style="width:auto" onchange="window._auditFiltro=this.value; render()">
            <option value="TODOS">Todos os módulos</option>
            ${Object.values(ROUTES).map(r => `<option value="${r.mod}_${r.titulo.toLowerCase().replace(/ /g,'_')}" ${filtro===r.mod?'selected':''}>${r.mod} · ${r.titulo}</option>`).join('')}
          </select>
        </div>
        <table>
          <thead><tr><th>Data</th><th>Usuário</th><th>Módulo</th><th>Ação</th><th>Hash</th></tr></thead>
          <tbody>
            ${logs.slice(0,20).map(l => {
              const u = state.usuarios.find(x => x.id === l.usuarioId);
              return `
                <tr>
                  <td class="text-xs">${fmtDateTime(l.criadoEm)}</td>
                  <td class="text-xs">${u?.nome || '—'}</td>
                  <td class="text-xs"><span class="badge bg-stone-100 text-[10px]">${l.modulo}</span></td>
                  <td class="text-xs"><strong>${l.acao}</strong><br><span class="text-stone-500">${l.detalhes}</span></td>
                  <td class="font-mono text-[10px] text-stone-500">${l.hash}</td>
                </tr>
              `;
            }).join('') || '<tr><td colspan="5" class="text-center text-stone-500 text-xs py-4">Sem logs no filtro.</td></tr>'}
          </tbody>
        </table>
      </div>

      <div class="card">
        <h3 class="font-display text-lg mb-3">Snapshots de backup</h3>
        <div class="space-y-2">
          ${state.backups.map(b => `
            <div class="border-l-2 border-brand-purple-600 pl-3 py-1">
              <p class="text-xs font-medium">${b.tipo.replace(/_/g,' ').toLowerCase()}</p>
              <p class="text-[10px] text-stone-500">${fmtDateTime(b.criadoEm)}</p>
              <p class="text-[10px] num text-stone-500">${(b.tamanho/1024/1024).toFixed(2)} MB · retém até ${fmtDate(b.retencaoAte)}</p>
              <p class="text-[10px] font-mono text-stone-400">${b.hash}</p>
            </div>
          `).join('')}
        </div>
        <button class="btn btn-primary w-full mt-3 justify-center text-xs" onclick="criarBackupManual()">
          <i data-lucide="hard-drive-download" class="w-3 h-3"></i> Criar backup manual
        </button>
      </div>
    </div>
  `;
}

async function criarBackupManual() {
  const conteudo = JSON.stringify(state);
  const hash = (await sha256(conteudo)).slice(0,4) + '...' + (await sha256(conteudo)).slice(-4);
  state.backups.unshift({
    id: 'b'+uid(), tipo: 'MANUAL',
    tamanho: conteudo.length, criadoEm: new Date().toISOString(),
    hash, retencaoAte: new Date(Date.now()+5*365*86400000).toISOString().slice(0,10)
  });
  logAuditoria('15_backup_auditoria', 'BACKUP_MANUAL', 'b'+uid(), `Snapshot manual criado · ${(conteudo.length/1024).toFixed(1)} KB`);
  persistState();
  toast('Backup criado e hash registrado');
  render();
}

// ============================================================================
// MODAL & TOAST
// ============================================================================
function abrirModal(html, tamanho = 'md') {
  const maxW = tamanho === 'lg' ? '720px' : '520px';
  document.body.insertAdjacentHTML('beforeend', `
    <div id="modal-overlay" class="modal-backdrop" onclick="if(event.target.id==='modal-overlay') fecharModal()">
      <div class="modal" style="max-width:${maxW}; padding:24px;">${html}</div>
    </div>
  `);
  if (typeof lucide!=='undefined') lucide.createIcons();
}
function fecharModal() {
  document.getElementById('modal-overlay')?.remove();
}
function toast(msg, tipo = 'sucesso') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = 'toast';
  if (tipo === 'erro') div.style.background = '#501313';
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// ============================================================================
// INIT — Fluxo: 1) inicializa Supabase  2) verifica sessão  3) mostra login OU app
// ============================================================================
async function boot() {
  // Espera Supabase JS carregar do CDN (até 8 segundos)
  let tentativas = 0;
  while (typeof supabase === 'undefined' && tentativas < 80) {
    await new Promise(r => setTimeout(r, 100));
    tentativas++;
  }
  if (!initSupabase()) {
    document.body.innerHTML = `<div style="padding:40px;text-align:center;font-family:sans-serif">
      <h2 style="font-family:Georgia,serif">Erro ao conectar com a nuvem</h2>
      <p>Não foi possível carregar a biblioteca Supabase. Verifique sua conexão de internet.</p>
      <button onclick="location.reload()" style="padding:10px 24px;background:#04342C;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;margin-top:16px">Tentar novamente</button>
    </div>`;
    return;
  }
  const user = await checkAuth();
  if (!user) {
    mostrarTelaLogin();
    return;
  }
  await iniciarApp(user);
}

function mostrarTelaLogin() {
  document.body.innerHTML = `
    <style>
      body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
             background: linear-gradient(135deg, #F4F1EA 0%, #E8E3D8 100%); font-family: 'Geist', system-ui, sans-serif; }
      .login-card { background:#FFF; padding:32px; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.08);
                    width:100%; max-width:380px; margin:20px; }
      .login-card h1 { font-family:'Fraunces', serif; font-size:28px; margin:0 0 4px; color:#1F1E1D; }
      .login-card .sub { font-size:13px; color:#6B6967; margin:0 0 24px; }
      .login-card label { display:block; font-size:12px; color:#6B6967; margin:12px 0 4px; }
      .login-card input { width:100%; padding:10px 12px; border:1px solid #D9D5CE; border-radius:6px;
                         font-size:14px; box-sizing:border-box; font-family:inherit; }
      .login-card input:focus { outline:none; border-color:#534AB7; }
      .login-card button { width:100%; margin-top:20px; padding:12px; background:#04342C; color:#FFF;
                          border:none; border-radius:6px; font-size:14px; font-weight:500; cursor:pointer; }
      .login-card button:hover { background:#0F6E56; }
      .login-card button:disabled { opacity:0.6; cursor:wait; }
      .login-card .erro { color:#501313; background:#FCEBEB; padding:8px 12px; border-radius:6px;
                          font-size:12px; margin-top:12px; display:none; }
      .login-card .erro.show { display:block; }
    </style>
    <div class="login-card">
      <h1>SequilhoPRO</h1>
      <p class="sub">Pitchu Doces · acesso ao sistema</p>
      <form id="login-form">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email" placeholder="seu@email.com">
        <label>Senha</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        <button type="submit" id="login-btn">Entrar</button>
        <div class="erro" id="login-erro"></div>
      </form>
    </div>
  `;
  document.getElementById('login-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const btn = document.getElementById('login-btn');
    const erro = document.getElementById('login-erro');
    erro.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    try {
      const user = await loginUser(fd.get('email'), fd.get('password'));
      // Login OK — recarrega a página para o boot rodar de novo (agora com sessão)
      location.reload();
    } catch (e) {
      erro.textContent = 'Email ou senha incorretos. ' + (e.message || '');
      erro.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  };
}

async function iniciarApp(user) {
  // Carrega dados do Supabase para popular o state
  try {
    const indicador = document.createElement('div');
    indicador.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#534AB7;color:#FFF;text-align:center;padding:8px;font-size:13px;z-index:9999;font-family:sans-serif';
    indicador.textContent = 'Carregando dados da nuvem…';
    document.body.appendChild(indicador);
    const novoState = await carregarStateDoSupabase();
    state = novoState;
    migrarState();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
    document.body.removeChild(indicador);
  } catch (e) {
    console.error('Erro carregando do Supabase:', e);
    alert('Erro ao carregar dados da nuvem. Verifique sua conexão e tente novamente.\n\n' + (e.message || ''));
    return;
  }
  // Renderiza app
  render();
  // Insere status sync + botão sair no header
  setTimeout(injetarHeaderUsuario, 100);
}

function injetarHeaderUsuario() {
  // Busca o header principal (vai variar conforme estrutura — coloca no topo da sidebar)
  const sidebar = document.querySelector('aside');
  if (!sidebar || document.getElementById('user-bar')) return;
  const userBar = document.createElement('div');
  userBar.id = 'user-bar';
  userBar.style.cssText = 'padding:8px 12px; border-top:1px solid #E5E3DE; margin-top:auto; display:flex; flex-direction:column; gap:6px; font-size:11px;';
  userBar.innerHTML = `
    <div style="display:flex; align-items:center; gap:6px; color:#6B6967;">
      <span id="sync-status"></span>
    </div>
    <button onclick="logoutUser()" style="background:none; border:1px solid #D9D5CE; padding:6px; border-radius:4px; color:#6B6967; cursor:pointer; font-size:11px;">
      Sair (${state.usuarioAtual?.nome || 'usuário'})
    </button>
  `;
  sidebar.appendChild(userBar);
}

// Dispara o boot
boot();
</script>
